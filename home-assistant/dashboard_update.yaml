# ============================================================
# WAVESHARE ESPHOME HOME ASSISTANT DASHBOARD - UPDATE CHECKER
# v1.2.0 development
#
# Compares the build installed on the ESP32 with the remote
# version.json manifest. No local version/package edits are needed.
# ============================================================

rest:
  - resource: "https://raw.githubusercontent.com/Marcobedendo78/Waveshare-ESPHome-Home-Assistant-Dashboard/dev-v1.2.0/version.json"
    scan_interval: 3600
    timeout: 15
    headers:
      User-Agent: "Home-Assistant-Waveshare-Dashboard"
    sensor:
      - name: "Waveshare Dashboard Latest Build"
        unique_id: waveshare_dashboard_latest_build
        icon: mdi:update
        value_template: >-
          {{ value_json.build | default('unknown', true) }}
        json_attributes:
          - channel
          - version
          - branch
          - message

# Auto-detect the ESPHome build sensor. This avoids depending on the
# device/area prefix that Home Assistant may add to entity IDs.
template:
  - sensor:
      - name: "Waveshare Dashboard Installed Build"
        unique_id: waveshare_dashboard_installed_build
        icon: mdi:source-commit
        availability: >-
          {% set ns = namespace(matches=[]) %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('waveshare_dashboard_build') %}
              {% set ns.matches = ns.matches + [s.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.matches | count == 1
             and states(ns.matches[0]) not in ['unknown','unavailable','none',''] }}
        state: >-
          {% set ns = namespace(matches=[]) %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('waveshare_dashboard_build') %}
              {% set ns.matches = ns.matches + [s.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ states(ns.matches[0]) if ns.matches | count == 1 else 'unknown' }}
        attributes:
          source_entity: >-
            {% set ns = namespace(matches=[]) %}
            {% for s in states.sensor %}
              {% if s.entity_id.endswith('waveshare_dashboard_build') %}
                {% set ns.matches = ns.matches + [s.entity_id] %}
              {% endif %}
            {% endfor %}
            {{ ns.matches[0] if ns.matches | count == 1 else 'not uniquely detected' }}

      - name: "Waveshare Dashboard Installed Code Version"
        unique_id: waveshare_dashboard_installed_code_version
        icon: mdi:package-variant-closed
        availability: >-
          {% set ns = namespace(matches=[]) %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('waveshare_dashboard_code_version') %}
              {% set ns.matches = ns.matches + [s.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.matches | count == 1 }}
        state: >-
          {% set ns = namespace(matches=[]) %}
          {% for s in states.sensor %}
            {% if s.entity_id.endswith('waveshare_dashboard_code_version') %}
              {% set ns.matches = ns.matches + [s.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ states(ns.matches[0]) if ns.matches | count == 1 else 'unknown' }}

  - binary_sensor:
      - name: "Waveshare Dashboard Update Available"
        unique_id: waveshare_dashboard_update_available
        icon: mdi:update
        availability: >-
          {{ states('sensor.waveshare_dashboard_latest_build') not in
             ['unknown','unavailable','none','']
             and states('sensor.waveshare_dashboard_installed_build') not in
             ['unknown','unavailable','none',''] }}
        state: >-
          {{ states('sensor.waveshare_dashboard_latest_build') !=
             states('sensor.waveshare_dashboard_installed_build') }}
        attributes:
          installed_build: >-
            {{ states('sensor.waveshare_dashboard_installed_build') }}
          latest_build: >-
            {{ states('sensor.waveshare_dashboard_latest_build') }}
          installed_version: >-
            {{ states('sensor.waveshare_dashboard_installed_code_version') }}
          latest_version: >-
            {{ state_attr('sensor.waveshare_dashboard_latest_build', 'version') }}
          update_message: >-
            {{ state_attr('sensor.waveshare_dashboard_latest_build', 'message') }}

# Persistent Home Assistant notification.
automation:
  - id: waveshare_dashboard_update_available_notification
    alias: "Waveshare Dashboard - Aggiornamento disponibile"
    description: >-
      Notifica automaticamente quando il codice remoto della dashboard
      ha un build diverso da quello installato sul display.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.waveshare_dashboard_update_available
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/1"
    actions:
      - delay: "00:00:20"
      - condition: state
        entity_id: binary_sensor.waveshare_dashboard_update_available
        state: "on"
      - action: persistent_notification.create
        data:
          notification_id: waveshare_dashboard_update
          title: "Aggiornamento display Waveshare disponibile"
          message: >-
            È disponibile un nuovo aggiornamento della dashboard.

            Versione installata: **{{ states('sensor.waveshare_dashboard_installed_code_version') }}**
            Build installato: **{{ states('sensor.waveshare_dashboard_installed_build') }}**

            Versione disponibile: **{{ state_attr('sensor.waveshare_dashboard_latest_build', 'version') }}**
            Build disponibile: **{{ states('sensor.waveshare_dashboard_latest_build') }}**

            {{ state_attr('sensor.waveshare_dashboard_latest_build', 'message') | default('', true) }}

            Non devi modificare YAML, versione o lista dei package.
            Apri ESPHome e premi **Installa** sul display: `refresh: always`
            scaricherà automaticamente il bundle e tutti i package aggiornati.

  - id: waveshare_dashboard_update_notification_dismiss
    alias: "Waveshare Dashboard - Chiudi notifica aggiornamento"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.waveshare_dashboard_update_available
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: waveshare_dashboard_update
