# ============================================================
# HOME ASSISTANT - DATI METEO PER DISPLAY ESP32
#
# Crea:
#   - 7 giorni di previsione da weather.marco_e_licia_home
#   - 31 valori giornalieri precipitazione per il grafico
#
# Le previsioni vengono aggiornate:
#   - all'avvio di Home Assistant
#   - ogni 30 minuti
#
# Il grafico precipitazioni usa il valore MAX giornaliero di:
#   sensor.sensore_pioggia_aqara_2
#
# Questo replica la logica della mini-graph-card indicata:
#   aggregate_func: max
#   group_by: date
# ============================================================

template:
  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/30"

    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.marco_e_licia_home
        data:
          type: daily
        response_variable: daily_weather

      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.sensore_pioggia_aqara_2
          start_time: "{{ (now() - timedelta(days=30)).replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}"
          end_time: "{{ now().isoformat() }}"
          period: day
          types:
            - max
        response_variable: rain_stats

    sensor:
      - name: "Display Meteo Aggiornamento"
        unique_id: display_meteo_aggiornamento
        state: "{{ now().isoformat() }}"

      - name: "Display Pioggia Max"
        unique_id: display_pioggia_max
        unit_of_measurement: "mm"
        state: >-
          {% set rows = rain_stats.get('statistics', {}).get('sensor.sensore_pioggia_aqara_2', []) %}
          {% set ns = namespace(v=0) %}
          {% for r in rows %}
            {% set x = r.max | default(0) | float(0) %}
            {% if x > ns.v %}{% set ns.v = x %}{% endif %}
          {% endfor %}
          {{ ns.v | round(2) }}

      - name: "Display Meteo Giorno 0"
        unique_id: display_meteo_giorno_0
        state: >-
          {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
          {{ f[0].condition if (f | count) > 0 else 'unknown' }}
        attributes:
          datetime: >-
            {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
            {{ f[0].datetime if (f | count) > 0 else '' }}
          temp_high: >-
            {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
            {{ f[0].temperature | float(0) if (f | count) > 0 else 0 }}
          temp_low: >-
            {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
            {{ f[0].templow | default(f[0].temperature) | float(0) if (f | count) > 0 else 0 }}
          precipitation: >-
            {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
            {{ f[0].precipitation | default(0) | float(0) if (f | count) > 0 else 0 }}
          precipitation_probability: >-
            {% set f = daily_weather.get('weather.marco_e_licia_home', {}).get('forecast', []) %}
            {{ f[0].precipitation_probability | default(0) | float(0) if (f | count) > 0 else 0 }}

