name: v1.1 migration

on:
  push:
    branches:
      - dev-v1.1.0

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'Run v1.1 migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v1.1.0

      - name: Make dashboard topics configurable
        shell: python
        run: |
          from pathlib import Path

          path = Path('esphome/dashboard-package.yaml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'home/robot/mower/control/timers': '${robot_mqtt_timers_topic}',
              'home/robot/mower/control/joystick': '${robot_mqtt_joystick_topic}',
              'home/robot/mower/control': '${robot_mqtt_control_topic}',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          if not changed:
              print('No MQTT topic replacements were necessary.')

          path.write_text(text, encoding='utf-8')

          # This migration workflow is intentionally one-shot.
          workflow = Path('.github/workflows/v1_1_migrate.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/dashboard-package.yaml .github/workflows/v1_1_migrate.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Make robot MQTT topics configurable"
          git push origin HEAD:dev-v1.1.0
