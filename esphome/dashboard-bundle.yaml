# ============================================================
# WAVESHARE ESPHOME HOME ASSISTANT DASHBOARD - REMOTE BUNDLE
# v1.2.0 development
#
# This is the ONLY remote package file that the local
# waveshare-display.yaml needs to load.
# ============================================================

packages:
  dashboard_base: !include dashboard-package.yaml
  heating_slider: !include heating-slider-v1.2.yaml
  pdc_page: !include pdc-page-v1.2.yaml
  pdc_value_position_fix: !include pdc-value-position-fix-v1.2.yaml
  wallbox_flow: !include wallbox-flow-v1.2.yaml
  energy_font: !include energy-font-v1.2.yaml
  energy_page: !include energy-page-v1.2.2.yaml
  energy_layout_fix: !include energy-layout-fix-v1.2.3.yaml
  energy_date_fix: !include energy-date-fix-v1.2.3.yaml
  update_client: !include update-client-v1.2.yaml

# Development branch: always load the matching development component.
# Do NOT use ${dashboard_version} here because older local configurations
# may still report v1.1.1 even while the remote dashboard package itself
# is explicitly loaded from dev-v1.2.0.
external_components:
  - source:
      type: git
      url: https://github.com/Marcobedendo78/Waveshare-ESPHome-Home-Assistant-Dashboard
      ref: dev-v1.2.0
    components:
      - waveshare_sd
    refresh: always

waveshare_sd:
  id: dashboard_sd
