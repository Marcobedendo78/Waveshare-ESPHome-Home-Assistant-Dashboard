# ============================================================
# WAVESHARE DASHBOARD - PDC LAYOUT / FLOW FIX
# v1.2.0 development patch
# ============================================================

esphome:
  on_boot:
    priority: -50
    then:
      - delay: 1s
      - lambda: |-
          // Standard 58 px information boxes.
          // Move the values upward by roughly one full font height.
          // Fonts and box sizes remain unchanged.
          lv_obj_set_y(id(pdc_lbl_outdoor), 12);
          lv_obj_set_y(id(pdc_lbl_power), 12);
          lv_obj_set_y(id(pdc_lbl_fan), 12);
          lv_obj_set_y(id(pdc_lbl_compressor), 12);
          lv_obj_set_y(id(pdc_lbl_defrost), 12);
          lv_obj_set_y(id(pdc_lbl_cop), 12);
          lv_obj_set_y(id(pdc_lbl_freeze), 12);

          lv_obj_set_y(id(pdc_lbl_thermal_power), 12);
          lv_obj_set_y(id(pdc_lbl_dhw), 12);
          lv_obj_set_y(id(pdc_lbl_thermostat), 12);
          lv_obj_set_y(id(pdc_lbl_mode), 12);
          lv_obj_set_y(id(pdc_lbl_io_mode), 12);
          lv_obj_set_y(id(pdc_lbl_flow), 12);
          lv_obj_set_y(id(pdc_lbl_pressure), 12);
          lv_obj_set_y(id(pdc_lbl_indoor), 12);

          // Move MANDATA / RITORNO to the left of the pipes, above the
          // outdoor unit. Make the boxes narrower without changing fonts.
          lv_obj_t *supply_box = lv_obj_get_parent(id(pdc_lbl_supply));
          lv_obj_t *return_box = lv_obj_get_parent(id(pdc_lbl_return));

          lv_obj_set_pos(supply_box, 326, 188);
          lv_obj_set_size(supply_box, 112, 56);
          lv_obj_set_pos(return_box, 326, 250);
          lv_obj_set_size(return_box, 112, 56);

          // Reposition title labels (first child) and value labels.
          lv_obj_t *supply_title = lv_obj_get_child(supply_box, 0);
          lv_obj_t *return_title = lv_obj_get_child(return_box, 0);
          lv_obj_set_pos(supply_title, 6, 5);
          lv_obj_set_width(supply_title, 98);
          lv_obj_set_pos(return_title, 6, 5);
          lv_obj_set_width(return_title, 98);

          lv_obj_set_pos(id(pdc_lbl_supply), 6, 25);
          lv_obj_set_size(id(pdc_lbl_supply), 98, 24);
          lv_obj_set_pos(id(pdc_lbl_return), 6, 25);
          lv_obj_set_size(id(pdc_lbl_return), 98, 24);

# The base PDC animation updates every 180 ms. This second pass runs at the
# same cadence after the base package and corrects the dot coordinates so the
# dots stay on the visible red/blue pipes and do not cross the indoor unit.
interval:
  - interval: 180ms
    then:
      - lambda: |-
          float flow = id(pdc_water_flow).state;
          if (isnan(flow) || flow <= 0.05f) return;

          lv_obj_t *red[3] = {id(pdc_red_dot_1), id(pdc_red_dot_2), id(pdc_red_dot_3)};
          lv_obj_t *blue[3] = {id(pdc_blue_dot_1), id(pdc_blue_dot_2), id(pdc_blue_dot_3)};

          // RED / MANDATA:
          // outdoor unit -> lower red pipe -> vertical red pipe ->
          // upper pipe above the indoor unit.
          auto red_pos = [](int p, int &x, int &y) {
            if (p < 220) {
              x = 388 + (p * 112) / 220;
              y = 421;
            } else if (p < 760) {
              x = 500;
              y = 421 - ((p - 220) * 359) / 540;
            } else if (p < 900) {
              x = 500 + ((p - 760) * 145) / 140;
              y = 62;
            } else {
              x = 645;
              y = 62 + ((p - 900) * 88) / 100;
            }
          };

          // BLUE / RITORNO: reverse route on the blue pipe, remaining above
          // the indoor unit before descending along the exterior vertical.
          auto blue_pos = [](int p, int &x, int &y) {
            if (p < 100) {
              x = 635;
              y = 150 - (p * 78) / 100;
            } else if (p < 240) {
              x = 635 - ((p - 100) * 124) / 140;
              y = 72;
            } else if (p < 780) {
              x = 511;
              y = 72 + ((p - 240) * 366) / 540;
            } else {
              x = 511 - ((p - 780) * 123) / 220;
              y = 438;
            }
          };

          for (int i = 0; i < 3; i++) {
            int p = (id(pdc_flow_phase) + i * 333) % 1000;
            int x, y;
            red_pos(p, x, y);
            lv_obj_set_pos(red[i], x - 5, y - 5);
            blue_pos(p, x, y);
            lv_obj_set_pos(blue[i], x - 5, y - 5);
          }
