# ============================================================
# WAVESHARE DASHBOARD - PDC LAYOUT / FLOW FIX
# v1.2.0 development patch
# ============================================================

esphome:
  on_boot:
    priority: -50
    then:
      - delay: 1s
      - lambda: |-
          // Standard 58 px information boxes.
          // Keep the corrected vertical positions and move both title/value
          // further to the left inside every side box.
          lv_obj_t *values[] = {
            id(pdc_lbl_outdoor), id(pdc_lbl_power), id(pdc_lbl_fan),
            id(pdc_lbl_compressor), id(pdc_lbl_defrost), id(pdc_lbl_cop),
            id(pdc_lbl_freeze), id(pdc_lbl_thermal_power), id(pdc_lbl_dhw),
            id(pdc_lbl_thermostat), id(pdc_lbl_mode), id(pdc_lbl_io_mode),
            id(pdc_lbl_flow), id(pdc_lbl_pressure), id(pdc_lbl_indoor)
          };

          for (auto *value : values) {
            lv_obj_set_y(value, 12);
            lv_obj_set_x(value, -6);
          }

          // First child of each side box is the sensor title.
          for (auto *value : values) {
            lv_obj_t *box = lv_obj_get_parent(value);
            lv_obj_t *title = lv_obj_get_child(box, 0);
            lv_obj_set_y(title, -13);
            lv_obj_set_x(title, -6);
          }

          // MANDATA / RITORNO: retain current vertical correction and shift
          // title/value further left inside the compact boxes.
          lv_obj_t *supply_box = lv_obj_get_parent(id(pdc_lbl_supply));
          lv_obj_t *return_box = lv_obj_get_parent(id(pdc_lbl_return));

          lv_obj_set_pos(supply_box, 326, 188);
          lv_obj_set_size(supply_box, 112, 56);
          lv_obj_set_pos(return_box, 326, 250);
          lv_obj_set_size(return_box, 112, 56);

          lv_obj_t *supply_title = lv_obj_get_child(supply_box, 0);
          lv_obj_t *return_title = lv_obj_get_child(return_box, 0);
          lv_obj_set_pos(supply_title, -10, -9);
          lv_obj_set_width(supply_title, 108);
          lv_obj_set_pos(return_title, -10, -9);
          lv_obj_set_width(return_title, 108);

          lv_obj_set_pos(id(pdc_lbl_supply), -10, 7);
          lv_obj_set_size(id(pdc_lbl_supply), 108, 24);
          lv_obj_set_pos(id(pdc_lbl_return), -10, 7);
          lv_obj_set_size(id(pdc_lbl_return), 108, 24);

# The rendered pipes around the indoor unit do not align accurately enough
# with the animation. Keep animated dots only on the outdoor/lower pipe area
# and hide them before they reach the indoor-unit section.
interval:
  - interval: 180ms
    then:
      - lambda: |-
          float flow = id(pdc_water_flow).state;
          if (isnan(flow) || flow <= 0.05f) return;

          lv_obj_t *red[3] = {id(pdc_red_dot_1), id(pdc_red_dot_2), id(pdc_red_dot_3)};
          lv_obj_t *blue[3] = {id(pdc_blue_dot_1), id(pdc_blue_dot_2), id(pdc_blue_dot_3)};

          // RED: lower horizontal section and lower part of exterior vertical.
          auto red_pos = [](int p, int &x, int &y, bool &visible) {
            visible = p < 570;
            if (p < 220) {
              x = 388 + (p * 112) / 220;
              y = 421;
            } else {
              x = 500;
              y = 421 - ((p - 220) * 232) / 350;
            }
          };

          // BLUE: lower part of exterior vertical and lower horizontal only.
          auto blue_pos = [](int p, int &x, int &y, bool &visible) {
            visible = p >= 430;
            if (p < 780) {
              x = 511;
              y = 189 + ((p - 430) * 249) / 350;
            } else {
              x = 511 - ((p - 780) * 123) / 220;
              y = 438;
            }
          };

          for (int i = 0; i < 3; i++) {
            int p = (id(pdc_flow_phase) + i * 333) % 1000;
            int x, y;
            bool visible;

            red_pos(p, x, y, visible);
            if (visible) {
              lv_obj_clear_flag(red[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_pos(red[i], x - 5, y - 5);
            } else {
              lv_obj_add_flag(red[i], LV_OBJ_FLAG_HIDDEN);
            }

            blue_pos(p, x, y, visible);
            if (visible) {
              lv_obj_clear_flag(blue[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_pos(blue[i], x - 5, y - 5);
            } else {
              lv_obj_add_flag(blue[i], LV_OBJ_FLAG_HIDDEN);
            }
          }
