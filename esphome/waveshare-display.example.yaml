# ============================================================
# WAVESHARE ESP32-S3 TOUCH LCD 7B
# Local ESPHome configuration example for v1.2.0+
#
# QUICK SETUP
# 1) Copy this file as: waveshare-display.yaml
# 2) Copy user_config.example.yaml as: .user_config.yaml
# 3) Edit ONLY .user_config.yaml with your Home Assistant entities.
# 4) Copy the required secret values from secrets.example.yaml into
#    your normal ESPHome secrets.yaml.
#
# DASHBOARD FILES / IMAGES
# All dashboard YAML packages are loaded automatically from GitHub.
# Robot.jpg, capture_card.png and pdc-background.png are also fetched
# automatically from GitHub during compilation. They do NOT need to be
# copied into the user's ESPHome directory.
#
# sd_storage.h is currently the only local support file still required;
# it will be converted to a remotely installable component separately.
# ============================================================

substitutions: !include .user_config.yaml

packages:
  dashboard:
    url: https://github.com/Marcobedendo78/Waveshare-ESPHome-Home-Assistant-Dashboard
    ref: ${dashboard_version}
    files:
      - esphome/dashboard-bundle.yaml
    refresh: always

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

  project:
    name: marcobedendo78.waveshare-dashboard
    version: "1.2.0-dev"

  # Temporary local dependency: microSD support.
  includes:
    - sd_storage.h

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          if (sd_storage_mount()) {
            ESP_LOGI("sd_storage", "microSD montata correttamente");
            sd_storage_append_log("BOOT", "Waveshare display avviato");
          } else {
            ESP_LOGW("sd_storage", "microSD non disponibile: il display continua normalmente");
          }

# Allows ESPHome Device Builder to adopt an installed dashboard and create
# a minimal configuration backed by the public GitHub repository.
dashboard_import:
  package_import_url: github://Marcobedendo78/Waveshare-ESPHome-Home-Assistant-Dashboard/esphome/waveshare-display.example.yaml@dev-v1.2.0
  import_full_config: false

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - fatfs
        - esp_driver_sdspi

psram:
  mode: octal
  speed: 80MHz

time:
  - platform: homeassistant
    id: ha_time

logger:

api:
  encryption:
    key: !secret waveshare_display_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret waveshare_display_ap_password

captive_portal:

improv_serial:

# Exposes the exact dashboard release used by this device to Home Assistant.
text_sensor:
  - platform: template
    name: "Waveshare Dashboard Version"
    id: waveshare_dashboard_version
    icon: mdi:package-variant-closed
    update_interval: 60s
    lambda: |-
      return {"${dashboard_version}"};
