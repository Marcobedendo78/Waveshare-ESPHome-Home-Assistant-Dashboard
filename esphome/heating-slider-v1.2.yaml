# ============================================================
# WAVESHARE DASHBOARD - HEATING SLIDER UI OVERRIDE
# v1.2.0
# ============================================================
# IMPORTANT COLOR RULE
# This file NEVER decides slider color.
# Color is controlled only by heating-color-fix-v1.2.yaml using
# the same Tado overlay entities that controlled the old arcs:
#   overlay OFF = green (automatic)
#   overlay ON  = orange (manual override)
# ============================================================

sensor:
  # TARGET TEMPERATURE - climate entity attribute "temperature"
  - id: !extend heat_salotto_target
    on_value:
      - lvgl.slider.update:
          id: heat_salotto_slider
          value: !lambda 'return (int) lroundf(x * 10.0f);'
      - lvgl.label.update:
          id: heat_salotto_target_v12
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 0;'}
          then:
            - lambda: 'id(heating_popup_target) = x;'
            - lvgl.slider.update:
                id: heating_popup_slider
                value: !lambda 'return (int) lroundf(x * 10.0f);'
            - lvgl.label.update:
                id: heating_popup_target_v12
                text: !lambda 'return str_sprintf("%.1f C", x);'

  - id: !extend heat_studio_target
    on_value:
      - lvgl.slider.update:
          id: heat_studio_slider
          value: !lambda 'return (int) lroundf(x * 10.0f);'
      - lvgl.label.update:
          id: heat_studio_target_v12
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 1;'}
          then:
            - lambda: 'id(heating_popup_target) = x;'
            - lvgl.slider.update:
                id: heating_popup_slider
                value: !lambda 'return (int) lroundf(x * 10.0f);'
            - lvgl.label.update:
                id: heating_popup_target_v12
                text: !lambda 'return str_sprintf("%.1f C", x);'

  - id: !extend heat_camera_matrimoniale_target
    on_value:
      - lvgl.slider.update:
          id: heat_camera_matrimoniale_slider
          value: !lambda 'return (int) lroundf(x * 10.0f);'
      - lvgl.label.update:
          id: heat_camera_matrimoniale_target_v12
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 2;'}
          then:
            - lambda: 'id(heating_popup_target) = x;'
            - lvgl.slider.update:
                id: heating_popup_slider
                value: !lambda 'return (int) lroundf(x * 10.0f);'
            - lvgl.label.update:
                id: heating_popup_target_v12
                text: !lambda 'return str_sprintf("%.1f C", x);'

  - id: !extend heat_camera_da_letto_target
    on_value:
      - lvgl.slider.update:
          id: heat_camera_da_letto_slider
          value: !lambda 'return (int) lroundf(x * 10.0f);'
      - lvgl.label.update:
          id: heat_camera_da_letto_target_v12
          text: !lambda 'return str_sprintf("%.1f C", x);'
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 3;'}
          then:
            - lambda: 'id(heating_popup_target) = x;'
            - lvgl.slider.update:
                id: heating_popup_slider
                value: !lambda 'return (int) lroundf(x * 10.0f);'
            - lvgl.label.update:
                id: heating_popup_target_v12
                text: !lambda 'return str_sprintf("%.1f C", x);'

  # CURRENT TEMPERATURE
  - id: !extend heat_salotto_temp
    on_value:
      - lvgl.label.update: {id: heat_salotto_current_v12, text: !lambda 'return str_sprintf("%.1f C", x);'}
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 0;'}
          then:
            - lvgl.label.update: {id: heating_popup_current_v12, text: !lambda 'return str_sprintf("Attuale %.1f C", x);'}

  - id: !extend heat_studio_temp
    on_value:
      - lvgl.label.update: {id: heat_studio_current_v12, text: !lambda 'return str_sprintf("%.1f C", x);'}
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 1;'}
          then:
            - lvgl.label.update: {id: heating_popup_current_v12, text: !lambda 'return str_sprintf("Attuale %.1f C", x);'}

  - id: !extend heat_camera_matrimoniale_temp
    on_value:
      - lvgl.label.update: {id: heat_camera_matrimoniale_current_v12, text: !lambda 'return str_sprintf("%.1f C", x);'}
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 2;'}
          then:
            - lvgl.label.update: {id: heating_popup_current_v12, text: !lambda 'return str_sprintf("Attuale %.1f C", x);'}

  - id: !extend heat_camera_da_letto_temp
    on_value:
      - lvgl.label.update: {id: heat_camera_da_letto_current_v12, text: !lambda 'return str_sprintf("%.1f C", x);'}
      - if:
          condition: {lambda: 'return id(heating_selected_room) == 3;'}
          then:
            - lvgl.label.update: {id: heating_popup_current_v12, text: !lambda 'return str_sprintf("Attuale %.1f C", x);'}

  # HUMIDITY
  - id: !extend heat_salotto_hum
    on_value:
      - lvgl.label.update: {id: heat_salotto_humidity_v12, text: !lambda 'return isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);'}
  - id: !extend heat_studio_hum
    on_value:
      - lvgl.label.update: {id: heat_studio_humidity_v12, text: !lambda 'return isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);'}
  - id: !extend heat_camera_matrimoniale_hum
    on_value:
      - lvgl.label.update: {id: heat_camera_matrimoniale_humidity_v12, text: !lambda 'return isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);'}
  - id: !extend heat_camera_da_letto_hum
    on_value:
      - lvgl.label.update: {id: heat_camera_da_letto_humidity_v12, text: !lambda 'return isnan(x) ? std::string("--%") : str_sprintf("%.0f%%", x);'}

  # HEATING OUTPUT - text only. It must never change slider color.
  - id: !extend heat_salotto_heating
    on_value:
      - lvgl.label.update:
          id: heat_salotto_state_v12
          text: !lambda 'return (isnan(x) || x <= 0.1f) ? std::string("Inattivo") : str_sprintf("Risc. %.0f%%", x);'

  - id: !extend heat_studio_heating
    on_value:
      - lvgl.label.update:
          id: heat_studio_state_v12
          text: !lambda 'return (isnan(x) || x <= 0.1f) ? std::string("Inattivo") : str_sprintf("Risc. %.0f%%", x);'

  - id: !extend heat_camera_matrimoniale_heating
    on_value:
      - lvgl.label.update:
          id: heat_camera_matrimoniale_state_v12
          text: !lambda 'return (isnan(x) || x <= 0.1f) ? std::string("Inattivo") : str_sprintf("Risc. %.0f%%", x);'

  - id: !extend heat_camera_da_letto_heating
    on_value:
      - lvgl.label.update:
          id: heat_camera_da_letto_state_v12
          text: !lambda 'return (isnan(x) || x <= 0.1f) ? std::string("Inattivo") : str_sprintf("Risc. %.0f%%", x);'

script:
  - id: !extend heating_popup_open
    then:
      - lvgl.widget.hide: heating_popup_arc
      - lvgl.widget.hide: heating_popup_state
      - lvgl.widget.hide: heating_popup_target_lbl
      - lvgl.widget.hide: heating_popup_current

      - lvgl.widget.hide: heat_salotto_slider
      - lvgl.widget.hide: heat_studio_slider
      - lvgl.widget.hide: heat_camera_matrimoniale_slider
      - lvgl.widget.hide: heat_camera_da_letto_slider
      - lvgl.widget.hide: heat_salotto_state_v12
      - lvgl.widget.hide: heat_salotto_current_v12
      - lvgl.widget.hide: heat_salotto_target_v12
      - lvgl.widget.hide: heat_salotto_humidity_v12
      - lvgl.widget.hide: heat_studio_state_v12
      - lvgl.widget.hide: heat_studio_current_v12
      - lvgl.widget.hide: heat_studio_target_v12
      - lvgl.widget.hide: heat_studio_humidity_v12
      - lvgl.widget.hide: heat_camera_matrimoniale_state_v12
      - lvgl.widget.hide: heat_camera_matrimoniale_current_v12
      - lvgl.widget.hide: heat_camera_matrimoniale_target_v12
      - lvgl.widget.hide: heat_camera_matrimoniale_humidity_v12
      - lvgl.widget.hide: heat_camera_da_letto_state_v12
      - lvgl.widget.hide: heat_camera_da_letto_current_v12
      - lvgl.widget.hide: heat_camera_da_letto_target_v12
      - lvgl.widget.hide: heat_camera_da_letto_humidity_v12

      - lambda: |-
          float target = 20.0f;
          float current = NAN;
          float heating = 0.0f;
          switch (id(heating_selected_room)) {
            case 0:
              target = id(heat_salotto_target).state;
              current = id(heat_salotto_temp).state;
              heating = id(heat_salotto_heating).state;
              break;
            case 1:
              target = id(heat_studio_target).state;
              current = id(heat_studio_temp).state;
              heating = id(heat_studio_heating).state;
              break;
            case 2:
              target = id(heat_camera_matrimoniale_target).state;
              current = id(heat_camera_matrimoniale_temp).state;
              heating = id(heat_camera_matrimoniale_heating).state;
              break;
            default:
              target = id(heat_camera_da_letto_target).state;
              current = id(heat_camera_da_letto_temp).state;
              heating = id(heat_camera_da_letto_heating).state;
              break;
          }
          if (isnan(target)) target = 20.0f;
          id(heating_popup_target) = target;
          lv_slider_set_value(id(heating_popup_slider), (int) lroundf(target * 10.0f), LV_ANIM_OFF);
          lv_label_set_text(id(heating_popup_target_v12), str_sprintf("%.1f C", target).c_str());
          lv_label_set_text(id(heating_popup_current_v12), isnan(current) ? "Attuale --.- C" : str_sprintf("Attuale %.1f C", current).c_str());
          lv_label_set_text(id(heating_popup_state_v12), (isnan(heating) || heating <= 0.1f) ? "Inattivo" : str_sprintf("Riscaldamento %.0f%%", heating).c_str());

      - lvgl.widget.show: heating_popup_state_v12
      - lvgl.widget.show: heating_popup_target_v12
      - lvgl.widget.show: heating_popup_current_v12
      - lvgl.widget.show: heating_popup_slider
      - lvgl.widget.show: heating_popup_min_lbl_v12
      - lvgl.widget.show: heating_popup_max_lbl_v12
      - lvgl.widget.show: heating_popup_close_v12

interval:
  - interval: 10s
    startup_delay: 1s
    then:
      - lvgl.widget.hide: heat_salotto_arc
      - lvgl.widget.hide: heat_studio_arc
      - lvgl.widget.hide: heat_camera_matrimoniale_arc
      - lvgl.widget.hide: heat_camera_da_letto_arc
      - lvgl.widget.hide: heat_salotto_state
      - lvgl.widget.hide: heat_salotto_current
      - lvgl.widget.hide: heat_salotto_target_lbl
      - lvgl.widget.hide: heat_salotto_humidity_lbl
      - lvgl.widget.hide: heat_studio_state
      - lvgl.widget.hide: heat_studio_current
      - lvgl.widget.hide: heat_studio_target_lbl
      - lvgl.widget.hide: heat_studio_humidity_lbl
      - lvgl.widget.hide: heat_camera_matrimoniale_state
      - lvgl.widget.hide: heat_camera_matrimoniale_current
      - lvgl.widget.hide: heat_camera_matrimoniale_target_lbl
      - lvgl.widget.hide: heat_camera_matrimoniale_humidity_lbl
      - lvgl.widget.hide: heat_camera_da_letto_state
      - lvgl.widget.hide: heat_camera_da_letto_current
      - lvgl.widget.hide: heat_camera_da_letto_target_lbl
      - lvgl.widget.hide: heat_camera_da_letto_humidity_lbl

lvgl:
  pages:
    - id: !extend page_heating
      widgets:
        # CARD INFORMATION
        - label: {id: heat_salotto_state_v12, x: 48, y: 112, width: 105, text_align: CENTER, text: "Inattivo", text_font: roboto_bold_16, text_color: 0xEAEAEA}
        - label: {id: heat_salotto_current_v12, x: 151, y: 106, width: 110, text_align: CENTER, text: "--.- C", text_font: roboto_bold_22, text_color: 0xFFFFFF}
        - label: {id: heat_salotto_target_v12, x: 259, y: 110, width: 105, text_align: CENTER, text: "--.- C", text_font: roboto_bold_18, text_color: 0xFFFFFF}
        - label: {id: heat_salotto_humidity_v12, x: 362, y: 110, width: 86, text_align: CENTER, text: "--%", text_font: roboto_bold_18, text_color: 0xD8D8D8}

        - label: {id: heat_studio_state_v12, x: 556, y: 112, width: 105, text_align: CENTER, text: "Inattivo", text_font: roboto_bold_16, text_color: 0xEAEAEA}
        - label: {id: heat_studio_current_v12, x: 659, y: 106, width: 110, text_align: CENTER, text: "--.- C", text_font: roboto_bold_22, text_color: 0xFFFFFF}
        - label: {id: heat_studio_target_v12, x: 767, y: 110, width: 105, text_align: CENTER, text: "--.- C", text_font: roboto_bold_18, text_color: 0xFFFFFF}
        - label: {id: heat_studio_humidity_v12, x: 870, y: 110, width: 86, text_align: CENTER, text: "--%", text_font: roboto_bold_18, text_color: 0xD8D8D8}

        - label: {id: heat_camera_matrimoniale_state_v12, x: 48, y: 344, width: 105, text_align: CENTER, text: "Inattivo", text_font: roboto_bold_16, text_color: 0xEAEAEA}
        - label: {id: heat_camera_matrimoniale_current_v12, x: 151, y: 338, width: 110, text_align: CENTER, text: "--.- C", text_font: roboto_bold_22, text_color: 0xFFFFFF}
        - label: {id: heat_camera_matrimoniale_target_v12, x: 259, y: 342, width: 105, text_align: CENTER, text: "--.- C", text_font: roboto_bold_18, text_color: 0xFFFFFF}
        - label: {id: heat_camera_matrimoniale_humidity_v12, x: 362, y: 342, width: 86, text_align: CENTER, text: "--%", text_font: roboto_bold_18, text_color: 0xD8D8D8}

        - label: {id: heat_camera_da_letto_state_v12, x: 556, y: 344, width: 105, text_align: CENTER, text: "Inattivo", text_font: roboto_bold_16, text_color: 0xEAEAEA}
        - label: {id: heat_camera_da_letto_current_v12, x: 659, y: 338, width: 110, text_align: CENTER, text: "--.- C", text_font: roboto_bold_22, text_color: 0xFFFFFF}
        - label: {id: heat_camera_da_letto_target_v12, x: 767, y: 342, width: 105, text_align: CENTER, text: "--.- C", text_font: roboto_bold_18, text_color: 0xFFFFFF}
        - label: {id: heat_camera_da_letto_humidity_v12, x: 870, y: 342, width: 86, text_align: CENTER, text: "--%", text_font: roboto_bold_18, text_color: 0xD8D8D8}

        # CARD SLIDERS
        - slider:
            id: heat_salotto_slider
            x: 64
            y: 190
            width: 388
            height: 32
            min_value: 50
            max_value: 250
            value: 200
            radius: 16
            bg_color: 0x303236
            bg_opa: COVER
            border_width: 0
            ext_click_area: 10
            indicator: {bg_color: 0x2E6B36, bg_opa: COVER, radius: 16}
            knob: {bg_color: 0xFFFFFF, border_width: 2, border_color: 0x43B853, radius: 12, pad_all: 2}
            on_value:
              - lvgl.label.update: {id: heat_salotto_target_v12, text: !lambda 'return str_sprintf("%.1f C", x / 10.0f);'}
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data: {entity_id: "${heating_living_climate}", temperature: !lambda 'return str_sprintf("%.1f", x / 10.0f);'}

        - slider:
            id: heat_studio_slider
            x: 572
            y: 190
            width: 388
            height: 32
            min_value: 50
            max_value: 250
            value: 200
            radius: 16
            bg_color: 0x303236
            bg_opa: COVER
            border_width: 0
            ext_click_area: 10
            indicator: {bg_color: 0x2E6B36, bg_opa: COVER, radius: 16}
            knob: {bg_color: 0xFFFFFF, border_width: 2, border_color: 0x43B853, radius: 12, pad_all: 2}
            on_value:
              - lvgl.label.update: {id: heat_studio_target_v12, text: !lambda 'return str_sprintf("%.1f C", x / 10.0f);'}
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data: {entity_id: "${heating_study_climate}", temperature: !lambda 'return str_sprintf("%.1f", x / 10.0f);'}

        - slider:
            id: heat_camera_matrimoniale_slider
            x: 64
            y: 422
            width: 388
            height: 32
            min_value: 50
            max_value: 250
            value: 200
            radius: 16
            bg_color: 0x303236
            bg_opa: COVER
            border_width: 0
            ext_click_area: 10
            indicator: {bg_color: 0x2E6B36, bg_opa: COVER, radius: 16}
            knob: {bg_color: 0xFFFFFF, border_width: 2, border_color: 0x43B853, radius: 12, pad_all: 2}
            on_value:
              - lvgl.label.update: {id: heat_camera_matrimoniale_target_v12, text: !lambda 'return str_sprintf("%.1f C", x / 10.0f);'}
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data: {entity_id: "${heating_main_bedroom_climate}", temperature: !lambda 'return str_sprintf("%.1f", x / 10.0f);'}

        - slider:
            id: heat_camera_da_letto_slider
            x: 572
            y: 422
            width: 388
            height: 32
            min_value: 50
            max_value: 250
            value: 200
            radius: 16
            bg_color: 0x303236
            bg_opa: COVER
            border_width: 0
            ext_click_area: 10
            indicator: {bg_color: 0x2E6B36, bg_opa: COVER, radius: 16}
            knob: {bg_color: 0xFFFFFF, border_width: 2, border_color: 0x43B853, radius: 12, pad_all: 2}
            on_value:
              - lvgl.label.update: {id: heat_camera_da_letto_target_v12, text: !lambda 'return str_sprintf("%.1f C", x / 10.0f);'}
            on_release:
              - homeassistant.action:
                  action: climate.set_temperature
                  data: {entity_id: "${heating_bedroom_climate}", temperature: !lambda 'return str_sprintf("%.1f", x / 10.0f);'}

        # POPUP VALUES
        - label:
            id: heating_popup_state_v12
            x: 382
            y: 172
            width: 240
            hidden: true
            text_align: CENTER
            text: "Inattivo"
            text_font: roboto_bold_18
            text_color: 0xFFFFFF

        - label:
            id: heating_popup_target_v12
            x: 350
            y: 198
            width: 180
            hidden: true
            text_align: CENTER
            text: "--.- C"
            text_font: roboto_bold_28
            text_color: 0xFFFFFF

        - label:
            id: heating_popup_current_v12
            x: 520
            y: 204
            width: 220
            hidden: true
            text_align: CENTER
            text: "Attuale --.- C"
            text_font: roboto_bold_20
            text_color: 0xD8D8D8

        # POPUP SLIDER
        - slider:
            id: heating_popup_slider
            x: 272
            y: 252
            width: 460
            height: 36
            hidden: true
            min_value: 50
            max_value: 250
            value: 200
            radius: 18
            bg_color: 0x303236
            bg_opa: COVER
            border_width: 0
            ext_click_area: 12
            indicator: {bg_color: 0x2E6B36, bg_opa: COVER, radius: 18}
            knob: {bg_color: 0xFFFFFF, border_width: 2, border_color: 0x43B853, radius: 13, pad_all: 2}
            on_value:
              - lambda: |-
                  const float t = x / 10.0f;
                  id(heating_popup_target) = t;
                  switch (id(heating_selected_room)) {
                    case 0:
                      lv_slider_set_value(id(heat_salotto_slider), x, LV_ANIM_OFF);
                      lv_label_set_text(id(heat_salotto_target_v12), str_sprintf("%.1f C", t).c_str());
                      break;
                    case 1:
                      lv_slider_set_value(id(heat_studio_slider), x, LV_ANIM_OFF);
                      lv_label_set_text(id(heat_studio_target_v12), str_sprintf("%.1f C", t).c_str());
                      break;
                    case 2:
                      lv_slider_set_value(id(heat_camera_matrimoniale_slider), x, LV_ANIM_OFF);
                      lv_label_set_text(id(heat_camera_matrimoniale_target_v12), str_sprintf("%.1f C", t).c_str());
                      break;
                    default:
                      lv_slider_set_value(id(heat_camera_da_letto_slider), x, LV_ANIM_OFF);
                      lv_label_set_text(id(heat_camera_da_letto_target_v12), str_sprintf("%.1f C", t).c_str());
                      break;
                  }
              - lvgl.label.update:
                  id: heating_popup_target_v12
                  text: !lambda 'return str_sprintf("%.1f C", x / 10.0f);'
            on_release:
              - script.execute: heating_popup_set_temperature

        - label:
            id: heating_popup_min_lbl_v12
            x: 270
            y: 294
            width: 70
            hidden: true
            text: "5 C"
            text_font: roboto_bold_16
            text_color: 0xD8D8D8

        - label:
            id: heating_popup_max_lbl_v12
            x: 662
            y: 294
            width: 70
            hidden: true
            text_align: RIGHT
            text: "25 C"
            text_font: roboto_bold_16
            text_color: 0xD8D8D8

        - button:
            id: heating_popup_close_v12
            x: 214
            y: 68
            width: 42
            height: 42
            hidden: true
            radius: 21
            bg_opa: 0%
            border_width: 0
            shadow_width: 0
            on_click:
              - lvgl.widget.hide: heating_popup
              - lvgl.widget.hide: heating_popup_state_v12
              - lvgl.widget.hide: heating_popup_target_v12
              - lvgl.widget.hide: heating_popup_current_v12
              - lvgl.widget.hide: heating_popup_slider
              - lvgl.widget.hide: heating_popup_min_lbl_v12
              - lvgl.widget.hide: heating_popup_max_lbl_v12
              - lvgl.widget.hide: heating_popup_close_v12
              - lvgl.widget.show: heat_salotto_slider
              - lvgl.widget.show: heat_studio_slider
              - lvgl.widget.show: heat_camera_matrimoniale_slider
              - lvgl.widget.show: heat_camera_da_letto_slider
              - lvgl.widget.show: heat_salotto_state_v12
              - lvgl.widget.show: heat_salotto_current_v12
              - lvgl.widget.show: heat_salotto_target_v12
              - lvgl.widget.show: heat_salotto_humidity_v12
