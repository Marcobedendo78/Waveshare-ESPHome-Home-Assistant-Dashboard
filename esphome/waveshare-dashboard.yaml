  - interval: 15ms
    then:
      - lambda: |-
          std::string s=id(wallbox_status).state;
          std::transform(s.begin(),s.end(),s.begin(),::tolower);
          const bool charging=(s=="charging");

          lv_obj_t* segs[64]={id(ev_cable_seg_0)->obj,id(ev_cable_seg_1)->obj,id(ev_cable_seg_2)->obj,id(ev_cable_seg_3)->obj,id(ev_cable_seg_4)->obj,id(ev_cable_seg_5)->obj,id(ev_cable_seg_6)->obj,id(ev_cable_seg_7)->obj,id(ev_cable_seg_8)->obj,id(ev_cable_seg_9)->obj,id(ev_cable_seg_10)->obj,id(ev_cable_seg_11)->obj,id(ev_cable_seg_12)->obj,id(ev_cable_seg_13)->obj,id(ev_cable_seg_14)->obj,id(ev_cable_seg_15)->obj,id(ev_cable_seg_16)->obj,id(ev_cable_seg_17)->obj,id(ev_cable_seg_18)->obj,id(ev_cable_seg_19)->obj,id(ev_cable_seg_20)->obj,id(ev_cable_seg_21)->obj,id(ev_cable_seg_22)->obj,id(ev_cable_seg_23)->obj,id(ev_cable_seg_24)->obj,id(ev_cable_seg_25)->obj,id(ev_cable_seg_26)->obj,id(ev_cable_seg_27)->obj,id(ev_cable_seg_28)->obj,id(ev_cable_seg_29)->obj,id(ev_cable_seg_30)->obj,id(ev_cable_seg_31)->obj,id(ev_cable_seg_32)->obj,id(ev_cable_seg_33)->obj,id(ev_cable_seg_34)->obj,id(ev_cable_seg_35)->obj,id(ev_cable_seg_36)->obj,id(ev_cable_seg_37)->obj,id(ev_cable_seg_38)->obj,id(ev_cable_seg_39)->obj,id(ev_cable_seg_40)->obj,id(ev_cable_seg_41)->obj,id(ev_cable_seg_42)->obj,id(ev_cable_seg_43)->obj,id(ev_cable_seg_44)->obj,id(ev_cable_seg_45)->obj,id(ev_cable_seg_46)->obj,id(ev_cable_seg_47)->obj,id(ev_cable_seg_48)->obj,id(ev_cable_seg_49)->obj,id(ev_cable_seg_50)->obj,id(ev_cable_seg_51)->obj,id(ev_cable_seg_52)->obj,id(ev_cable_seg_53)->obj,id(ev_cable_seg_54)->obj,id(ev_cable_seg_55)->obj,id(ev_cable_seg_56)->obj,id(ev_cable_seg_57)->obj,id(ev_cable_seg_58)->obj,id(ev_cable_seg_59)->obj,id(ev_cable_seg_60)->obj,id(ev_cable_seg_61)->obj,id(ev_cable_seg_62)->obj,id(ev_cable_seg_63)->obj};

          static int prev_head=-1;
          static bool ready=false;

          if(!ready){
            for(int i=0;i<64;i++){
              lv_obj_clear_flag(segs[i],LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_line_color(segs[i],lv_color_hex(0x123D2B),LV_PART_MAIN);
              lv_obj_set_style_line_width(segs[i],6,LV_PART_MAIN);
            }
            ready=true;
          }

          if(!charging){
            id(ev_charge_phase)=0.0f;
            if(prev_head>=0){
              for(int n=0;n<8;n++){
                int idx=(prev_head-n+64)%64;
                lv_obj_set_style_line_color(segs[idx],lv_color_hex(0x123D2B),LV_PART_MAIN);
                lv_obj_set_style_line_width(segs[idx],6,LV_PART_MAIN);
              }
            }
            prev_head=-1;
            return;
          }

          float a=id(wallbox_current).state;
          if(isnan(a)) a=0.0f;
          a=fmaxf(0.0f,fminf(16.0f,a));

          // Più veloce e con differenza ben visibile:
          // 6 A = 1.50 s
          // 16 A = 0.55 s
          float dur;
          if(a<=6.0f)
            dur=2.20f-(a/6.0f)*(2.20f-1.50f);
          else
            dur=1.50f-(a-6.0f)*(1.50f-0.55f)/10.0f;

          id(ev_charge_phase)+=0.015f/dur;
          while(id(ev_charge_phase)>=1.0f)
            id(ev_charge_phase)-=1.0f;

          int head=(int)floorf(id(ev_charge_phase)*64.0f)%64;
          if(head==prev_head)
            return;

          // Spegne solo la coda che esce dalla scia.
          if(prev_head>=0){
            int old_tail=(prev_head-7+64)%64;
            lv_obj_set_style_line_color(segs[old_tail],lv_color_hex(0x123D2B),LV_PART_MAIN);
            lv_obj_set_style_line_width(segs[old_tail],6,LV_PART_MAIN);
          }

          // Scia corta: solo 8 segmenti aggiornati.
          static const uint32_t colors[8]={
            0xE9FFF4,0x00FF7F,0x00F078,0x00D96A,
            0x00B75B,0x009F50,0x17613E,0x123D2B
          };
          static const int widths[8]={9,9,9,8,8,7,7,6};

          for(int n=0;n<8;n++){
            int idx=(head-n+64)%64;
            lv_obj_set_style_line_color(segs[idx],lv_color_hex(colors[n]),LV_PART_MAIN);
            lv_obj_set_style_line_width(segs[idx],widths[n],LV_PART_MAIN);
          }

          prev_head=head;

  - interval: 20ms
    then:
      - lambda: |-
          auto step_for_power = [](float watts) -> float {
            watts = fabsf(watts);
            if (watts <= 0.01f) return 0.0f;
            if (watts > 10000.0f) watts = 10000.0f;

            float n =
              (log10f(watts) - log10f(0.01f)) /
              (log10f(10000.0f) - log10f(0.01f));

            n = fmaxf(0.0f, fminf(1.0f, n));
            float duration = 5.0f - 4.9f * n;
            if (duration < 0.1f) duration = 0.1f;
            // Velocità ridotta del 50% rispetto alla V2.4.
            return 0.020f / (duration * 2.0f);
          };

          auto advance = [](float &phase, float step) {
            phase += step;
            while (phase >= 1.0f) phase -= 1.0f;
          };

          float solar = id(ha_solar_power).state;
          float grid  = id(ha_grid_power).state;
          float batt  = id(ha_battery_power).state;
          float home  = id(ha_home_power).state;
          float pdc   = id(ha_pdc_power).state;

          // ==================================================
          // VELOCITA' DEI PALLINI = POTENZA ALL'ARRIVO
          //
          // Esempio:
          // FV = 8 kW, RETE riceve 6 kW, HOME usa 2 kW:
          //   FV -> RETE  usa 6 kW  -> pallino più veloce
          //   FV -> HOME  usa 2 kW  -> pallino più lento
          //
          // La stessa regola vale per RETE e BATTERIA.
          // ==================================================

          // FV -> HOME: velocità in base a quanto assorbe HOME.
          if (!isnan(solar) && !isnan(home) &&
              solar > 0.01f && home > 0.01f)
            advance(id(flow_solar_home), step_for_power(home));

          // FV -> RETE: destinazione = RETE (potenza esportata).
          if (!isnan(solar) && !isnan(grid) &&
              solar > 0.01f && grid > 0.01f)
            advance(id(flow_solar_grid), step_for_power(grid));

          // RETE -> HOME: destinazione = HOME, non il prelievo totale rete.
          if (!isnan(grid) && !isnan(home) &&
              grid < -0.01f && home > 0.01f)
            advance(id(flow_grid_home), step_for_power(home));

          // BATTERIA -> RETE: destinazione = RETE.
          if (!isnan(grid) && !isnan(solar) && !isnan(batt) &&
              grid > 0.01f && solar <= 0.01f && batt < -0.01f)
            advance(id(flow_battery_grid), step_for_power(grid));

          // FV -> BATTERIA: destinazione = potenza di carica BATTERIA.
          if (!isnan(batt) && !isnan(solar) &&
              batt > 0.01f && solar > 0.01f)
            advance(id(flow_solar_battery), step_for_power(batt));

          // RETE -> BATTERIA: destinazione = potenza di carica BATTERIA.
          if (!isnan(grid) && !isnan(batt) &&
              grid < -0.01f && batt > 0.01f)
            advance(id(flow_grid_battery), step_for_power(batt));

          // BATTERIA -> HOME: destinazione = HOME.
          if (!isnan(batt) && !isnan(home) &&
              batt < -0.01f && home > 0.01f)
            advance(id(flow_battery_home), step_for_power(home));

          // HOME -> PDC: destinazione = assorbimento reale PDC.
          if (!isnan(pdc) && pdc > 0.01f)
            advance(id(flow_home_pdc), step_for_power(pdc));

          // HOME -> AUTO: destinazione = assorbimento Wallbox.
          // Non è disponibile un sensore di potenza istantanea Wallbox,
          // quindi usiamo la corrente impostata x 230 V.
          float auto_w = 0.0f;
          std::string wb = id(wallbox_status).state;
          std::transform(wb.begin(), wb.end(), wb.begin(), ::tolower);
          if (wb == "charging") {
            float a = id(wallbox_current).state;
            if (!isnan(a))
              auto_w = a * 230.0f;
          }
          if (auto_w > 0.01f)
            advance(id(flow_home_auto), step_for_power(auto_w));

      # FV -> RETE
      - lvgl.widget.update:
          id: dot_solar_grid
          x: !lambda |-
            static const int p[][2] = {{210,172}, {209,190}, {206,208}, {201,226}, {194,242}, {184,254}, {172,263}, {158,269}, {142,273}, {126,274}};
            constexpr int N = sizeof(p) / sizeof(p[0]);
            float f = id(flow_solar_grid);
            if (f < 0.0f) f = 0.0f;
            if (f > 1.0f) f = 1.0f;
            float s = f * (N - 1);
            int i = (int) floorf(s);
            if (i >= N - 1) i = N - 2;
            float q = s - i;
            return int(p[i][0] + (p[i+1][0] - p[i][0]) * q - 5);
          y: !lambda |-
            static const int p[][2] = {{210,172}, {209,190}, {206,208}, {201,226}, {194,242}, {184,254}, {172,263}, {158,269}, {142,273}, {126,274}};
            constexpr int N = sizeof(p) / sizeof(p[0]);
            float f = id(flow_solar_grid);
            if (f < 0.0f) f = 0.0f;
            if (f > 1.0f) f = 1.0f;
            float s = f * (N - 1);
            int i = (int) floorf(s);
            if (i >= N - 1) i = N - 2;
            float q = s - i;
            return int(p[i][1] + (p[i+1][1] - p[i][1]) * q - 5);
          hidden: !lambda |-
            float s=id(ha_solar_power).state;
            float g=id(ha_grid_power).state;
