# ============================================================
# INTERVAL
# ============================================================

interval:

  # ==========================================================
  # RISCALDAMENTO / TADO - aggiornamento popup condiviso
  # ==========================================================
  - interval: 1s
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(heating_popup), LV_OBJ_FLAG_HIDDEN)) return;

          int r=id(heating_selected_room);
          float t=NAN,h=NAN,heat=NAN;
          bool power=false,link=false,window=false,overlay=false;
          std::string hvac="",preset="",tado="";

          if(r==0){
            t=id(heat_salotto_temp).state; h=id(heat_salotto_hum).state; heat=id(heat_salotto_heating).state;
            power=id(heat_salotto_power).state; link=id(heat_salotto_link).state;
            window=id(heat_salotto_window).state; overlay=id(heat_salotto_overlay).state;
            hvac=id(heat_salotto_hvac_mode).state; preset=id(heat_salotto_preset).state; tado=id(heat_salotto_tado_mode).state;
          } else if(r==1){
            t=id(heat_studio_temp).state; h=id(heat_studio_hum).state; heat=id(heat_studio_heating).state;
            power=id(heat_studio_power).state; link=id(heat_studio_link).state;
            window=id(heat_studio_window).state; overlay=id(heat_studio_overlay).state;
            hvac=id(heat_studio_hvac_mode).state; preset=id(heat_studio_preset).state; tado=id(heat_studio_tado_mode).state;
          } else if(r==2){
            t=id(heat_camera_matrimoniale_temp).state; h=id(heat_camera_matrimoniale_hum).state; heat=id(heat_camera_matrimoniale_heating).state;
            power=id(heat_camera_matrimoniale_power).state; link=id(heat_camera_matrimoniale_link).state;
            window=id(heat_camera_matrimoniale_window).state; overlay=id(heat_camera_matrimoniale_overlay).state;
            hvac=id(heat_camera_matrimoniale_hvac_mode).state; preset=id(heat_camera_matrimoniale_preset).state; tado=id(heat_camera_matrimoniale_tado_mode).state;
          } else {
            t=id(heat_camera_da_letto_temp).state; h=id(heat_camera_da_letto_hum).state; heat=id(heat_camera_da_letto_heating).state;
            power=id(heat_camera_da_letto_power).state; link=id(heat_camera_da_letto_link).state;
            window=id(heat_camera_da_letto_window).state; overlay=id(heat_camera_da_letto_overlay).state;
            hvac=id(heat_camera_da_letto_hvac_mode).state; preset=id(heat_camera_da_letto_preset).state; tado=id(heat_camera_da_letto_tado_mode).state;
          }

          lv_label_set_text(id(heating_popup_current), isnan(t)?"Attuale --.- C":str_sprintf("Attuale %.1f C",t).c_str());
          lv_label_set_text(id(heating_popup_state),
            (isnan(heat)||heat<=0.1f)?"Inattivo":str_sprintf("Riscaldamento %.0f%%",heat).c_str());

          lv_label_set_text(id(heating_popup_status),
            str_sprintf("Power: %s\nLink: %s\nFinestra: %s\nOverlay: %s\nTado: %s",
              power?"ON":"OFF", link?"OK":"OFF",
              window?"APERTA":"Chiusa", overlay?"Attivo":"No",
              tado.empty()?"--":tado.c_str()).c_str());

          auto paint_btn=[](lv_obj_t* o,bool active,uint32_t color){
            lv_obj_set_style_bg_color(o,lv_color_hex(active?color:0x282B30),LV_PART_MAIN);
            lv_obj_set_style_border_color(o,lv_color_hex(active?color:0x555B63),LV_PART_MAIN);
            lv_obj_set_style_border_width(o,active?3:1,LV_PART_MAIN);
          };

          paint_btn(id(heating_btn_mode_auto), hvac=="auto", 0x147EA3);
          paint_btn(id(heating_btn_mode_heat), hvac=="heat", 0x9A4314);
          paint_btn(id(heating_btn_mode_off),  hvac=="off",  0x6B6B6B);

          paint_btn(id(heating_btn_preset_away), preset=="away", 0x147EA3);
          paint_btn(id(heating_btn_preset_home), preset=="home", 0x147EA3);
          paint_btn(id(heating_btn_preset_auto), preset=="auto", 0x147EA3);

          uint32_t c=overlay?0x9A4314:0x2E6B36;
          uint32_t kc=overlay?0xD85A18:0x43B853;
          lv_obj_set_style_arc_color(id(heating_popup_arc),lv_color_hex(c),LV_PART_INDICATOR);
          lv_obj_set_style_border_color(id(heating_popup_arc),lv_color_hex(kc),LV_PART_KNOB);

  # ==========================================================
  # PAGINA METEO - aggiornamento UI
  # ==========================================================
  - interval: 1s
    then:
      - lambda: |-
          auto now=id(ha_time).now();

          auto it_condition = [](std::string s) -> std::string {
            if(s=="sunny") return "Soleggiato";
            if(s=="clear-night") return "Sereno";
            if(s=="partlycloudy") return "Parzialmente nuvoloso";
            if(s=="cloudy") return "Nuvoloso";
            if(s=="rainy") return "Pioggia";
            if(s=="pouring") return "Pioggia intensa";
            if(s=="lightning") return "Temporale";
            if(s=="lightning-rainy") return "Temporale con pioggia";
            if(s=="snowy") return "Neve";
            if(s=="snowy-rainy") return "Neve e pioggia";
            if(s=="fog") return "Nebbia";
            if(s=="windy" || s=="windy-variant") return "Ventoso";
            if(s=="hail") return "Grandine";
            return s;
          };

          auto day_name = [](int dow) -> const char* {
            // ESPHome: Sunday=1 ... Saturday=7
            static const char* n[]={"","Dom","Lun","Mar","Mer","Gio","Ven","Sab"};
            if(dow<1 || dow>7) return "--";
            return n[dow];
          };

          std::string cond=id(weather_state).state;
          const bool is_night = (id(weather_sun_state).state != "above_horizon");
          if (is_night && cond == "sunny")
            cond = "clear-night";
          if (is_night && cond == "partlycloudy")
            cond = "clear-night";

          float t=id(weather_temp).state;
          float h=id(weather_humidity).state;

          lv_label_set_text(id(weather_page_condition),it_condition(cond).c_str());
          lv_label_set_text(id(weather_page_temp),
            isnan(t)?"--.- C":str_sprintf("%.1f C",t).c_str());
          lv_label_set_text(id(weather_page_humidity),
            isnan(h)?"--% umidita":str_sprintf("%.0f%% umidita",h).c_str());
          float apparent=id(weather_apparent).state;
          float aqi=id(weather_aqi).state;
          lv_label_set_text(id(weather_page_apparent),
            isnan(apparent)?"Percepita --.- C":str_sprintf("Percepita %.1f C",apparent).c_str());
          lv_label_set_text(id(weather_page_aqi),
            isnan(aqi)?"AQI --":str_sprintf("AQI %.0f",aqi).c_str());

          if(now.is_valid()){
            lv_label_set_text(id(weather_page_clock),
              str_sprintf("%02d:%02d:%02d",now.hour,now.minute,now.second).c_str());

            static const char* mesi[]={"","gennaio","febbraio","marzo","aprile","maggio","giugno",
              "luglio","agosto","settembre","ottobre","novembre","dicembre"};
            static const char* giorni[]={"","domenica","lunedi","martedi","mercoledi","giovedi","venerdi","sabato"};
            lv_label_set_text(id(weather_page_date),
              str_sprintf("%s %d %s %d",
                giorni[now.day_of_week],now.day_of_month,mesi[now.month],now.year).c_str());
          }

          // Previsioni 7 giorni.
          float lows[7]={
            id(weather_fc_low_0).state,id(weather_fc_low_1).state,id(weather_fc_low_2).state,
            id(weather_fc_low_3).state,id(weather_fc_low_4).state,id(weather_fc_low_5).state,
            id(weather_fc_low_6).state
          };
          float highs[7]={
            id(weather_fc_high_0).state,id(weather_fc_high_1).state,id(weather_fc_high_2).state,
            id(weather_fc_high_3).state,id(weather_fc_high_4).state,id(weather_fc_high_5).state,
            id(weather_fc_high_6).state
          };
          lv_obj_t* low_lbl[7]={
            id(weather_fc_low_lbl_0),id(weather_fc_low_lbl_1),id(weather_fc_low_lbl_2),
            id(weather_fc_low_lbl_3),id(weather_fc_low_lbl_4),id(weather_fc_low_lbl_5),
            id(weather_fc_low_lbl_6)
          };
          lv_obj_t* high_lbl[7]={
            id(weather_fc_high_lbl_0),id(weather_fc_high_lbl_1),id(weather_fc_high_lbl_2),
            id(weather_fc_high_lbl_3),id(weather_fc_high_lbl_4),id(weather_fc_high_lbl_5),
            id(weather_fc_high_lbl_6)
          };
          lv_obj_t* day_lbl[7]={
            id(weather_fc_day_0),id(weather_fc_day_1),id(weather_fc_day_2),
            id(weather_fc_day_3),id(weather_fc_day_4),id(weather_fc_day_5),
            id(weather_fc_day_6)
          };

          float global_lo=1000.0f,global_hi=-1000.0f;
          for(int i=0;i<7;i++){
            bool valid = !isnan(lows[i]) && !isnan(highs[i]) &&
                         !(fabsf(lows[i]) < 0.01f && fabsf(highs[i]) < 0.01f);
            if(valid){
              global_lo=fminf(global_lo,lows[i]);
              global_hi=fmaxf(global_hi,highs[i]);
            }
          }
          if(global_hi<=global_lo){ global_lo=0; global_hi=30; }

          for(int i=0;i<7;i++){
            if(now.is_valid()){
              time_t ts=now.timestamp+(i*86400);
              struct tm tmv; localtime_r(&ts,&tmv);
              // tm_wday: 0=Sun ...6=Sat -> convert ESP-style
              int wd=tmv.tm_wday+1;
              lv_label_set_text(day_lbl[i],day_name(wd));
            }

            bool valid_day = !isnan(lows[i]) && !isnan(highs[i]) &&
                             !(fabsf(lows[i]) < 0.01f && fabsf(highs[i]) < 0.01f);
            lv_label_set_text(low_lbl[i],
              valid_day?str_sprintf("%.0f C",lows[i]).c_str():"--");
            lv_label_set_text(high_lbl[i],
              valid_day?str_sprintf("%.0f C",highs[i]).c_str():"--");

            // Barra semplice: nessun intervallo colorato.
            // Solo oggi mostriamo il pallino della temperatura esterna reale
            // sulla scala settimanale Tmin -> Tmax.
            if(i==0){
              float span=global_hi-global_lo;
              if(span < 1.0f) span = 1.0f;

              float cur=id(weather_temp).state;
              if(!isnan(cur)){
                int mx=(int)roundf(235.0f*(cur-global_lo)/span)-11;
                mx=std::max(0,std::min(213,mx));
                lv_obj_set_x(id(weather_fc_current_marker),145+mx);
                lv_obj_clear_flag(id(weather_fc_current_marker),LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(id(weather_fc_current_marker),LV_OBJ_FLAG_HIDDEN);
              }
            }
          }

          // Pannello sensori.
          lv_label_set_text(id(lbl_w_sun),
            id(weather_sun_state).state=="above_horizon"?"Sopra orizzonte":"Sotto orizzonte");
          lv_label_set_text(id(lbl_w_dawn),id(weather_next_dawn).state.c_str());
          lv_label_set_text(id(lbl_w_sunset),id(weather_next_setting).state.c_str());

          float rain=id(weather_rain).state;
          lv_label_set_text(id(lbl_w_rain),
            isnan(rain)?"--":str_sprintf("%.2f",rain).c_str());
          if (!id(weather_pluvio_seen_tip)) {
            lv_label_set_text(id(lbl_w_pluvio), "--");
          } else {
            uint32_t elapsed_s = (millis() - id(weather_pluvio_last_tip_ms)) / 1000UL;
            if (elapsed_s < 60UL) {
              lv_label_set_text(id(lbl_w_pluvio), "ora");
            } else if (elapsed_s < 3600UL) {
              lv_label_set_text(id(lbl_w_pluvio),
                str_sprintf("%lu min fa", (unsigned long)(elapsed_s / 60UL)).c_str());
            } else if (elapsed_s < 86400UL) {
              lv_label_set_text(id(lbl_w_pluvio),
                str_sprintf("%lu h fa", (unsigned long)(elapsed_s / 3600UL)).c_str());
            } else {
              lv_label_set_text(id(lbl_w_pluvio),
                str_sprintf("%lu g fa", (unsigned long)(elapsed_s / 86400UL)).c_str());
            }
          }
          lv_label_set_text(id(lbl_w_temp_ext),
            isnan(t)?"--":str_sprintf("%.1f C",t).c_str());
          lv_label_set_text(id(lbl_w_hum_ext),
            isnan(h)?"--":str_sprintf("%.0f%%",h).c_str());

          float s1=id(weather_soil_1).state,s2=id(weather_soil_2).state;
          lv_label_set_text(id(lbl_w_soil_1),
            isnan(s1)?"--":str_sprintf("%.0f%%",s1).c_str());
          lv_label_set_text(id(lbl_w_soil_2),
            isnan(s2)?"--":str_sprintf("%.0f%%",s2).c_str());

          // Grafico precipitazioni 31 giorni.
          float rv[31]={
            id(weather_rain_day_0).state,id(weather_rain_day_1).state,id(weather_rain_day_2).state,id(weather_rain_day_3).state,id(weather_rain_day_4).state,id(weather_rain_day_5).state,id(weather_rain_day_6).state,id(weather_rain_day_7).state,id(weather_rain_day_8).state,id(weather_rain_day_9).state,id(weather_rain_day_10).state,id(weather_rain_day_11).state,id(weather_rain_day_12).state,id(weather_rain_day_13).state,id(weather_rain_day_14).state,id(weather_rain_day_15).state,id(weather_rain_day_16).state,id(weather_rain_day_17).state,id(weather_rain_day_18).state,id(weather_rain_day_19).state,id(weather_rain_day_20).state,id(weather_rain_day_21).state,id(weather_rain_day_22).state,id(weather_rain_day_23).state,id(weather_rain_day_24).state,id(weather_rain_day_25).state,id(weather_rain_day_26).state,id(weather_rain_day_27).state,id(weather_rain_day_28).state,id(weather_rain_day_29).state,id(weather_rain_day_30).state
          };
          lv_obj_t* rb[31]={
            id(weather_rain_bar_0),id(weather_rain_bar_1),id(weather_rain_bar_2),id(weather_rain_bar_3),id(weather_rain_bar_4),id(weather_rain_bar_5),id(weather_rain_bar_6),id(weather_rain_bar_7),id(weather_rain_bar_8),id(weather_rain_bar_9),id(weather_rain_bar_10),id(weather_rain_bar_11),id(weather_rain_bar_12),id(weather_rain_bar_13),id(weather_rain_bar_14),id(weather_rain_bar_15),id(weather_rain_bar_16),id(weather_rain_bar_17),id(weather_rain_bar_18),id(weather_rain_bar_19),id(weather_rain_bar_20),id(weather_rain_bar_21),id(weather_rain_bar_22),id(weather_rain_bar_23),id(weather_rain_bar_24),id(weather_rain_bar_25),id(weather_rain_bar_26),id(weather_rain_bar_27),id(weather_rain_bar_28),id(weather_rain_bar_29),id(weather_rain_bar_30)
          };
          float rmax=1.0f;
          for(int i=0;i<31;i++)
            if(!isnan(rv[i]) && rv[i]>rmax) rmax=rv[i];
          float scale=fmaxf(1.0f,ceilf(rmax));
          lv_label_set_text(id(weather_rain_scale),str_sprintf("%.0f",scale).c_str());

          for(int i=0;i<31;i++){
            float v=(isnan(rv[i])||rv[i]<0)?0:rv[i];
            int hh=(int)roundf(64.0f*v/scale);
            hh=std::max(1,std::min(64,hh));
            lv_obj_set_y(rb[i],94-hh);
            lv_obj_set_height(rb[i],hh);

            // soglie colore della mini-graph-card originale
            uint32_t c=
              v>=12?0x030FFC:
              v>=7 ?0x353FFC:
              v>=5 ?0x656DFC:
              v>=3 ?0x979DFC:
              v>=1 ?0xAFB3FA:
                    0xFFFFFF;
            lv_obj_set_style_bg_color(rb[i],lv_color_hex(c),LV_PART_MAIN);
          }

  # Grafici Wallbox: ultime ricariche singole + settimana L-D
  - interval: 1s
    then:
      - lambda: |-
          float sess[7];
          for (int i=0;i<7;i++) sess[i]=id(ev_session_history)[i];

          float week[7]={
            id(week_ev_mon).state,id(week_ev_tue).state,id(week_ev_wed).state,
            id(week_ev_thu).state,id(week_ev_fri).state,id(week_ev_sat).state,
            id(week_ev_sun).state
          };

          float smax=0.1f,wmax=0.1f;
          for(int i=0;i<7;i++){
            if(!isnan(sess[i]) && sess[i]>smax) smax=sess[i];
            if(!isnan(week[i]) && week[i]>wmax) wmax=week[i];
          }
          float ss=fmaxf(2.0f,ceilf(smax/2.0f)*2.0f);
          float ws=fmaxf(5.0f,ceilf(wmax/5.0f)*5.0f);

          lv_obj_t* sb[7]={
            id(ev_session_bar_0),id(ev_session_bar_1),id(ev_session_bar_2),
            id(ev_session_bar_3),id(ev_session_bar_4),id(ev_session_bar_5),
            id(ev_session_bar_6)
          };
          lv_obj_t* wb[7]={
            id(ev_week_bar_0),id(ev_week_bar_1),id(ev_week_bar_2),
            id(ev_week_bar_3),id(ev_week_bar_4),id(ev_week_bar_5),
            id(ev_week_bar_6)
          };

          for(int i=0;i<7;i++){
            float a=(isnan(sess[i])||sess[i]<0)?0:sess[i];
            float b=(isnan(week[i])||week[i]<0)?0:week[i];

            int hsp=(int)roundf(106.0f*a/ss);
            int hwp=(int)roundf(106.0f*b/ws);
            hsp=std::max(0,std::min(106,hsp));
            hwp=std::max(0,std::min(106,hwp));

            lv_obj_set_y(sb[i],140-hsp);
            lv_obj_set_height(sb[i],hsp>0?hsp:1);

            lv_obj_set_y(wb[i],140-hwp);
            lv_obj_set_height(wb[i],hwp>0?hwp:1);
          }

          lv_label_set_text(id(lbl_ev_session_axis_max),str_sprintf("%.0f",ss).c_str());
          lv_label_set_text(id(lbl_ev_week_axis_max),str_sprintf("%.0f",ws).c_str());


  # Grafici settimanali Lunedì -> Domenica, stile istogramma reale
  - interval: 1s
    then:
      - lambda: |-
          float pv[7]={
            id(week_pv_mon).state,id(week_pv_tue).state,id(week_pv_wed).state,
            id(week_pv_thu).state,id(week_pv_fri).state,id(week_pv_sat).state,
            id(week_pv_sun).state
          };
          float hc[7]={
            id(week_home_mon).state,id(week_home_tue).state,id(week_home_wed).state,
            id(week_home_thu).state,id(week_home_fri).state,id(week_home_sat).state,
            id(week_home_sun).state
          };

          float pmax=0.1f,hmax=0.1f;
          for(int i=0;i<7;i++){
            if(!isnan(pv[i])&&pv[i]>pmax) pmax=pv[i];
            if(!isnan(hc[i])&&hc[i]>hmax) hmax=hc[i];
          }

          // Scala leggibile: arrotondata al multiplo di 5 kWh successivo.
          float pscale=fmaxf(5.0f,ceilf(pmax/5.0f)*5.0f);
          float hscale=fmaxf(5.0f,ceilf(hmax/5.0f)*5.0f);

          lv_obj_t* pvb[7]={
            id(week_pv_bar_0),id(week_pv_bar_1),id(week_pv_bar_2),id(week_pv_bar_3),
            id(week_pv_bar_4),id(week_pv_bar_5),id(week_pv_bar_6)
          };
          lv_obj_t* hcb[7]={
            id(week_home_bar_0),id(week_home_bar_1),id(week_home_bar_2),id(week_home_bar_3),
            id(week_home_bar_4),id(week_home_bar_5),id(week_home_bar_6)
          };

          for(int i=0;i<7;i++){
            float vp=(isnan(pv[i])||pv[i]<0)?0.0f:pv[i];
            float vh=(isnan(hc[i])||hc[i]<0)?0.0f:hc[i];

            int hp=(int)roundf(112.0f*vp/pscale);
            int hh=(int)roundf(112.0f*vh/hscale);
            hp=std::max(0,std::min(112,hp));
            hh=std::max(0,std::min(112,hh));

            lv_obj_set_y(pvb[i],160-hp);
            lv_obj_set_height(pvb[i],hp>0?hp:1);

            lv_obj_set_y(hcb[i],160-hh);
            lv_obj_set_height(hcb[i],hh>0?hh:1);
          }

