            widgets:
              - label:
                  align: CENTER
                  text: "CHIUDI"
                  text_font: roboto_bold_16

        # selezione timer
        - button:
            x: 280
            y: 90
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  id(timer_selected)--;
                  if(id(timer_selected)<1) id(timer_selected)=6;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: "<"
                  text_font: roboto_bold_22

        - label:
            id: lbl_timer_number
            x: 362
            y: 103
            width: 300
            text_align: CENTER
            text: "Timer 1"
            text_font: roboto_bold_22
            text_color: 0xFFFFFF

        - button:
            x: 674
            y: 90
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  id(timer_selected)++;
                  if(id(timer_selected)>6) id(timer_selected)=1;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: ">"
                  text_font: roboto_bold_22

        # ORA
        - label:
            x: 120
            y: 190
            text: "ORA"
            text_font: roboto_bold_18
            text_color: 0xAEB4BF

        - button:
            x: 110
            y: 230
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  int n=id(timer_selected);
                  int* p = n==1?&id(t1_h):n==2?&id(t2_h):n==3?&id(t3_h):n==4?&id(t4_h):n==5?&id(t5_h):&id(t6_h);
                  (*p)--; if(*p<0)*p=23;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: roboto_bold_22

        - label:
            id: lbl_timer_hour
            x: 190
            y: 240
            width: 80
            text_align: CENTER
            text: "08"
            text_font: roboto_bold_28
            text_color: 0xFFFFFF

        - button:
            x: 280
            y: 230
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  int n=id(timer_selected);
                  int* p = n==1?&id(t1_h):n==2?&id(t2_h):n==3?&id(t3_h):n==4?&id(t4_h):n==5?&id(t5_h):&id(t6_h);
                  (*p)++; if(*p>23)*p=0;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: roboto_bold_22

        # MINUTI
        - label:
            x: 390
            y: 190
            text: "MINUTI"
            text_font: roboto_bold_18
            text_color: 0xAEB4BF

        - button:
            x: 390
            y: 230
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  int n=id(timer_selected);
                  int* p = n==1?&id(t1_m):n==2?&id(t2_m):n==3?&id(t3_m):n==4?&id(t4_m):n==5?&id(t5_m):&id(t6_m);
                  (*p)-=5; if(*p<0)*p=55;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: roboto_bold_22

        - label:
            id: lbl_timer_minute
            x: 470
            y: 240
