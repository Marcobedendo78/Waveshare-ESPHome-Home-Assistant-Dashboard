      - homeassistant.action: {action: input_boolean.turn_on, data: {entity_id: "input_boolean.wallbox_modo_misto"}}
      - homeassistant.action: {action: input_boolean.turn_off, data: {entity_id: "input_boolean.wallbox_modo_manuale"}}
      - homeassistant.action: {action: input_boolean.turn_off, data: {entity_id: "input_boolean.wallbox_modo_boost"}}

  - id: wallbox_mode_manual_script
