          std::transform(st.begin(), st.end(), st.begin(), ::tolower);

          if (st == "charging") {
            // All'inizio della nuova sessione il contatore OCPP può ripartire da zero.
            float v = id(wallbox_session_energy).state;
            id(ev_session_peak) = isnan(v) ? 0.0f : v;
          }

          if (st == "available") {
            float v = id(ev_session_peak);
            if (v > 0.05f && fabsf(v - id(ev_last_saved_session)) > 0.02f) {
              for (int i = 0; i < 6; i++)
                id(ev_session_history)[i] = id(ev_session_history)[i + 1];
              id(ev_session_history)[6] = v;
              id(ev_last_saved_session) = v;
            }
            id(ev_session_peak) = 0.0f;
          }

