  # ==========================================================
  # RISCALDAMENTO / TADO - SENSORI NUMERICI
  # ==========================================================

  - platform: homeassistant
    id: heat_salotto_temp
    entity_id: sensor.salotto_temperatura
    internal: true
    on_value:
      - lvgl.label.update:
          id: heat_salotto_current
          text:
