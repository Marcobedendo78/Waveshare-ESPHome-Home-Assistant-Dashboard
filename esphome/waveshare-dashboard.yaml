# ============================================================
# WAVESHARE ESP32-S3-TOUCH-LCD-7B 1024x600
# Home Assistant panel: Distribuzione energia + Robot tagliaerba
#
# NOTE IMPORTANTE:
# In Home Assistant -> Impostazioni -> Dispositivi e servizi ->
# ESPHome -> waveshare-display -> Configura:
# attivare "Consenti al dispositivo di eseguire azioni Home Assistant".
#
# I comandi robot vengono inviati tramite l'azione HA mqtt.publish
# agli stessi topic/payload della Robot Joystick Card.
# ============================================================

esphome:
  name: waveshare-display
  friendly_name: waveshare-display

  includes:
    - sd_storage.h

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          if (sd_storage_mount()) {
            ESP_LOGI("sd_storage", "microSD montata correttamente");
            sd_storage_append_log("BOOT", "Waveshare display avviato");
          } else {
            ESP_LOGW("sd_storage", "microSD non disponibile: il display continua normalmente");
          }

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - fatfs
        - esp_driver_sdspi

psram:
  mode: octal
  speed: 80MHz

time:
  - platform: homeassistant
    id: ha_time

logger:

api:
  encryption:
    key: !secret waveshare_display__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: waveshare-displ Fallback Hotspot
    password: !secret waveshare_display__ap_password
captive_portal:

# ============================================================
# HARDWARE DISPLAY / TOUCH
# ============================================================

i2c:
  - id: i2c_bus
    sda: GPIO8
    scl: GPIO9
    scan: true

# Bus SPI dedicato allo slot TF/microSD onboard
# Waveshare 7B: MOSI=GPIO11, SCK=GPIO12, MISO=GPIO13
spi:
  - id: sd_spi
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
    interface: spi2

waveshare_io_ch32v003:
  - id: waveshare_io
    i2c_id: i2c_bus

switch:
  - platform: gpio
    id: lcd_vdd
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: waveshare_io
      number: 6

  - platform: gpio
    id: lcd_disp
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: waveshare_io
      number: 2

  # Chip Select TF/microSD: EXIO4, attivo LOW
  - platform: gpio
    id: sd_cs_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: waveshare_io
      number: 4
      inverted: true

display:
  - platform: rpi_dpi_rgb
    id: main_display
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    pclk_pin: GPIO7
    pclk_inverted: true
    pclk_frequency: 16MHz
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    data_pins:
      red:
        - GPIO1
        - GPIO2
        - GPIO42
        - GPIO41
        - GPIO40
      green:
        - GPIO39
        - GPIO0
        - GPIO45
        - GPIO48
        - GPIO47
        - GPIO21
      blue:
        - GPIO14
        - GPIO38
        - GPIO18
        - GPIO17
        - GPIO10

    hsync_pulse_width: 20
    hsync_front_porch: 160
    hsync_back_porch: 140
    vsync_pulse_width: 3
    vsync_front_porch: 12
    vsync_back_porch: 20

    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touchscreen_id
    display: main_display
    i2c_id: i2c_bus
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: waveshare_io
      number: 1

    # Joystick analogico: riceve coordinate continue del GT911.
    on_update:
      - lambda: |-
          if (!id(joystick_mode))
            return;

          for (auto touch : touches) {
            if (touch.state > 2)
              continue;

            // Pad joystick pagina Robot: centro (512, 265), raggio utile 110 px.
            const float cx = 512.0f;
            const float cy = 265.0f;
            const float max_dist = 110.0f;

            float dx = float(touch.x) - cx;
            float dy = float(touch.y) - cy;
            float dist = sqrtf(dx * dx + dy * dy);

            // Accetta solo tocchi dentro al pad.
            if (dist > 135.0f)
              continue;

            if (dist > max_dist && dist > 0.0f) {
              dx = dx / dist * max_dist;
              dy = dy / dist * max_dist;
            }

            float x = dx / max_dist;
            float y = -(dy / max_dist);

            // deadzone uguale alla card HA
            if (fabsf(x) < 0.18f) x = 0.0f;
            if (fabsf(y) < 0.18f) y = 0.0f;

            x = fmaxf(-1.0f, fminf(1.0f, x));
            y = fmaxf(-1.0f, fminf(1.0f, y));

            float left  = fmaxf(-1.0f, fminf(1.0f, y + x));
            float right = fmaxf(-1.0f, fminf(1.0f, y - x));

            // quantizzazione a step 10 come nella card HA
            auto q10 = [](float v) -> int {
              int p = int(roundf(v * 100.0f));
              p = int(roundf(float(p) / 10.0f)) * 10;
              if (p > 100) p = 100;
              if (p < -100) p = -100;
              return p;
            };

            id(joy_x) = q10(x);
            id(joy_y) = q10(y);
            id(joy_left) = q10(left);
            id(joy_right) = q10(right);
            id(joy_active) = true;
            id(joy_send_stop) = false;
            id(joy_knob_x) = int(cx + dx - 30);
            id(joy_knob_y) = int(cy + dy - 30);
          }

    on_release:
      - lambda: |-
          if (!id(joystick_mode))
            return;

          id(joy_x) = 0;
          id(joy_y) = 0;
          id(joy_left) = 0;
          id(joy_right) = 0;
          id(joy_active) = false;
          id(joy_send_stop) = true;
          id(joy_knob_x) = 482;
          id(joy_knob_y) = 235;

