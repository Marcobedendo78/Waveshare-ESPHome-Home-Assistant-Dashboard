  # Potenza HOME calcolata considerando FV, rete e batteria:
  #
  #   HOME = FV - RETE(raw) - BATTERIA(raw)
  #
  # Convenzione segni:
  #   RETE < 0      = prelievo dalla rete
  #   RETE > 0      = immissione in rete
  #   BATTERIA > 0  = batteria in carica
  #   BATTERIA < 0  = batteria in scarica
  #
  # Quindi:
  #   - il prelievo dalla rete viene sommato a HOME;
  #   - l'immissione in rete viene sottratta da HOME;
  #   - la carica batteria viene sottratta da HOME;
  #   - la scarica batteria viene sommata a HOME.
  - platform: template
    id: ha_home_power
    internal: true
    update_interval: 1s
    lambda: |-
      float solar   = id(ha_solar_power).state;
      float grid    = id(ha_grid_power).state;
      float battery = id(ha_battery_power).state;

      if (isnan(solar) || isnan(grid) || isnan(battery))
        return NAN;

      return solar - grid - battery;

    on_value:
      - lvgl.label.update:
          id: lbl_home_power
          text: !lambda |-
            char buf[24];

            if (isnan(x))
              snprintf(buf, sizeof(buf), "---");
            else if (fabsf(x) < 1000.0f)
              snprintf(buf, sizeof(buf), "%.0f W", x);
            else
              snprintf(buf, sizeof(buf), "%.2f kW", x / 1000.0f);

            return std::string(buf);

  - platform: homeassistant
    id: ha_grid_power
    entity_id: sensor.power_meter_potenza_attiva
    internal: true
    on_value:
      - lambda: |-
          if (x > 0.01f) id(last_grid_direction) = 1;
          else if (x < -0.01f) id(last_grid_direction) = -1;

      - lvgl.label.update:
          id: lbl_grid_export
          text: !lambda |-
            char buf[24];
            float v = x > 0.0f ? x : 0.0f;
            if (v < 1000.0f) snprintf(buf, sizeof(buf), "< %.0f W", v);
            else snprintf(buf, sizeof(buf), "< %.2f kW", v / 1000.0f);
            return std::string(buf);

      - lvgl.label.update:
          id: lbl_grid_import
          text: !lambda |-
            char buf[24];
            float v = x < 0.0f ? -x : 0.0f;
            if (v < 1000.0f) snprintf(buf, sizeof(buf), "> %.0f W", v);
            else snprintf(buf, sizeof(buf), "> %.2f kW", v / 1000.0f);
            return std::string(buf);

      - lvgl.widget.update:
          id: circle_grid
          border_color: !lambda |-
            return id(last_grid_direction) > 0
              ? lv_color_hex(0x00FF00)
              : lv_color_hex(0xFF0000);

  - platform: homeassistant
    id: ha_battery_power
    entity_id: sensor.battery_potenza_di_carica_scarica
    internal: true
    on_value:
      - lambda: |-
          if (x > 0.01f) id(last_battery_direction) = 1;
          else if (x < -0.01f) id(last_battery_direction) = -1;

      - lvgl.label.update:
          id: lbl_battery_charge
          text: !lambda |-
            char buf[24];
            float v = x > 0.0f ? x : 0.0f;
            if (v < 1000.0f) snprintf(buf, sizeof(buf), "v %.0f W", v);
            else snprintf(buf, sizeof(buf), "v %.2f kW", v / 1000.0f);
            return std::string(buf);

      - lvgl.label.update:
          id: lbl_battery_discharge
          text: !lambda |-
            char buf[24];
            float v = x < 0.0f ? -x : 0.0f;
            if (v < 1000.0f) snprintf(buf, sizeof(buf), "^ %.0f W", v);
            else snprintf(buf, sizeof(buf), "^ %.2f kW", v / 1000.0f);
            return std::string(buf);

      - lvgl.widget.update:
          id: circle_battery
          border_color: !lambda |-
            return id(last_battery_direction) > 0
              ? lv_color_hex(0x00A2FF)
              : lv_color_hex(0xCCFF00);

