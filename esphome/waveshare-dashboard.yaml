# ============================================================
# SCRIPT ROBOT - STESSI TOPIC / PAYLOAD DELLA CARD HA
# ============================================================

script:


  # ==========================================================
  # RISCALDAMENTO / TADO - SCRIPT CONDIVISI
  # ==========================================================

  - id: heating_popup_set_temperature
    mode: restart
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            temperature: !lambda 'return str_sprintf("%.1f", id(heating_popup_target));'

  - id: heating_popup_open
    mode: restart
    then:
      - lvgl.label.update:
          id: heating_popup_title
          text: !lambda |-
            switch(id(heating_selected_room)) {
              case 0: return std::string("Salotto");
              case 1: return std::string("Studio");
              case 2: return std::string("Camera Matrimoniale");
              default:return std::string("Camera da letto");
            }
      - lambda: |-
          switch(id(heating_selected_room)) {
            case 0: id(heating_popup_target)=id(heat_salotto_target).state; break;
            case 1: id(heating_popup_target)=id(heat_studio_target).state; break;
            case 2: id(heating_popup_target)=id(heat_camera_matrimoniale_target).state; break;
            default:id(heating_popup_target)=id(heat_camera_da_letto_target).state; break;
          }
          if (isnan(id(heating_popup_target))) id(heating_popup_target)=20.0f;
      - lvgl.arc.update:
          id: heating_popup_arc
          value: !lambda 'return (int) lroundf(id(heating_popup_target)*10.0f);'
      - lvgl.label.update:
          id: heating_popup_target_lbl
          text: !lambda 'return str_sprintf("%.1f C", id(heating_popup_target));'
      - lvgl.widget.show: heating_popup

  - id: heating_mode_auto
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            hvac_mode: "auto"

  - id: heating_mode_heat
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            hvac_mode: "heat"

  - id: heating_mode_off
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            hvac_mode: "off"

  - id: heating_preset_away
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            preset_mode: "away"

  - id: heating_preset_home
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            preset_mode: "home"

  - id: heating_preset_auto
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: !lambda |-
              return id(heating_selected_room)==0 ? std::string("climate.salotto") :
                     id(heating_selected_room)==1 ? std::string("climate.studio") :
                     id(heating_selected_room)==2 ? std::string("climate.camera_matrimoniale") :
                                                    std::string("climate.camera_da_letto");
            preset_mode: "auto"

  # Recupera dal Recorder Home Assistant il massimo giornaliero
  # di sensor.inverter_rendimento_giornaliero per gli ultimi 7 giorni.

  - id: wallbox_set_current
    mode: restart
    then:
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: "number.wallbox_maximum_current"
            value: !lambda 'return str_sprintf("%.0f", id(wallbox_slider_value));'

