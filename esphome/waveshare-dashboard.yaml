            else if (fabsf(x) < 1000.0f) snprintf(buf, sizeof(buf), "%.0f W", x);
            else snprintf(buf, sizeof(buf), "%.2f kW", x / 1000.0f);
            return std::string(buf);

  # ==========================================================
  # SENSORI ROBOT
  # ==========================================================

  - platform: homeassistant
    id: mower_battery_voltage
    entity_id: sensor.mower_battery
    internal: true
    on_value:
      # La percentuale usa gli stessi estremi della card HA:
      # 26.4 V = 0%, 33.6 V = 100%.
      - lvgl.label.update:
          id: lbl_robot_battery_pct
          text: !lambda |-
            float pct = ((x - 26.4f) / (33.6f - 26.4f)) * 100.0f;
            pct = fmaxf(0.0f, fminf(100.0f, pct));
            return str_sprintf("%.0f%%", pct);

      # Colore identico alla card originale:
      # >35% verde, 16..35% giallo, <=15% rosso.
      # Numero tacche:
      # >=10 1, >=30 2, >=50 3, >=70 4, >=90 5.
      - lvgl.widget.update:
          id: robot_batt_bar1
          bg_color: !lambda |-
            float pct=((x-26.4f)/(33.6f-26.4f))*100.0f;
            pct=fmaxf(0.0f,fminf(100.0f,pct));
            uint32_t c=pct<=15.0f?0xFF4D4D:(pct<=35.0f?0xE8B21F:0x24C95B);
            return lv_color_hex(pct>=10.0f?c:0xBBBBBB);

      - lvgl.widget.update:
          id: robot_batt_bar2
          bg_color: !lambda |-
            float pct=((x-26.4f)/(33.6f-26.4f))*100.0f;
            pct=fmaxf(0.0f,fminf(100.0f,pct));
            uint32_t c=pct<=15.0f?0xFF4D4D:(pct<=35.0f?0xE8B21F:0x24C95B);
            return lv_color_hex(pct>=30.0f?c:0xBBBBBB);

      - lvgl.widget.update:
          id: robot_batt_bar3
          bg_color: !lambda |-
            float pct=((x-26.4f)/(33.6f-26.4f))*100.0f;
            pct=fmaxf(0.0f,fminf(100.0f,pct));
            uint32_t c=pct<=15.0f?0xFF4D4D:(pct<=35.0f?0xE8B21F:0x24C95B);
            return lv_color_hex(pct>=50.0f?c:0xBBBBBB);

      - lvgl.widget.update:
          id: robot_batt_bar4
          bg_color: !lambda |-
            float pct=((x-26.4f)/(33.6f-26.4f))*100.0f;
            pct=fmaxf(0.0f,fminf(100.0f,pct));
            uint32_t c=pct<=15.0f?0xFF4D4D:(pct<=35.0f?0xE8B21F:0x24C95B);
            return lv_color_hex(pct>=70.0f?c:0xBBBBBB);

      - lvgl.widget.update:
          id: robot_batt_bar5
          bg_color: !lambda |-
            float pct=((x-26.4f)/(33.6f-26.4f))*100.0f;
