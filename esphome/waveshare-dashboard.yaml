            text_align: CENTER
            text: "00"
            text_font: roboto_bold_28
            text_color: 0xFFFFFF

        - button:
            x: 560
            y: 230
            width: 70
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  int n=id(timer_selected);
                  int* p = n==1?&id(t1_m):n==2?&id(t2_m):n==3?&id(t3_m):n==4?&id(t4_m):n==5?&id(t5_m):&id(t6_m);
                  (*p)+=5; if(*p>59)*p=0;
              - script.execute: refresh_timer_ui
            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: roboto_bold_22

        # STATO
        - label:
            x: 680
            y: 190
            text: "STATO"
            text_font: roboto_bold_18
            text_color: 0xAEB4BF

        - button:
            x: 680
            y: 230
            width: 180
            height: 55
            styles: robot_cmd_style
            on_click:
              - lambda: |-
                  int n=id(timer_selected);
                  int* p = n==1?&id(t1_e):n==2?&id(t2_e):n==3?&id(t3_e):n==4?&id(t4_e):n==5?&id(t5_e):&id(t6_e);
