  # ----------------------------------------------------------
  # LOG ENERGIA SU microSD - campione ogni 15 minuti
  # ----------------------------------------------------------
  - interval: 15min
    then:
      - lambda: |-
          // I grafici HOME non usano più i vecchi buffer RAM 24h.
          // Il logging CSV su microSD resta attivo ogni 15 minuti.
          float s = id(ha_solar_power).state;
          float soc = id(ha_battery_soc).state;

          // Salvataggio storico su microSD in CSV.
          if (sd_storage_is_mounted()) {
            auto now = id(ha_time).now();
            int64_t ts = now.is_valid() ? (int64_t) now.timestamp : 0;

            float grid = id(ha_grid_power).state;
            float batt = id(ha_battery_power).state;
            float home = id(ha_home_power).state;
            float pdc  = id(ha_pdc_power).state;

            sd_storage_append_energy(
              ts,
              isnan(s) ? 0.0f : s,
              isnan(grid) ? 0.0f : grid,
              isnan(batt) ? 0.0f : batt,
              isnan(home) ? 0.0f : home,
              isnan(pdc) ? 0.0f : pdc,
              isnan(soc) ? 0.0f : soc
            );
          }

      # I due vecchi grafici lineari (FV 24h e SOC batteria) sono stati
      # rimossi dalla pagina HOME e sostituiti da:
      # - rendimento giornaliero FV a barre (7 giorni)
      # - riquadro meteo
      # Lo storico su microSD continua comunque a essere salvato sopra.

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(joystick_mode);'
          then:
            - lvgl.widget.update:
                id: joy_knob
                x: !lambda 'return id(joy_knob_x);'
                y: !lambda 'return id(joy_knob_y);'

            - lvgl.label.update:
                id: lbl_joy_xy
                text: !lambda |-
                  return str_sprintf("X: %d   Y: %d", id(joy_x), id(joy_y));

            - lvgl.label.update:
                id: lbl_joy_lr
                text: !lambda |-
                  return str_sprintf("LEFT: %d   RIGHT: %d", id(joy_left), id(joy_right));

            - if:
                condition:
                  lambda: 'return id(joy_active) || id(joy_send_stop);'
                then:
                  - homeassistant.action:
                      action: mqtt.publish
                      data:
                        topic: "home/robot/mower/control/joystick"
                        qos: "0"
                        retain: "false"
                      data_template:
                        payload: "{{ joy_payload }}"
                      variables:
                        joy_payload: |-
                          return str_sprintf(
                            "{\"type\":\"joystick\",\"x\":%d,\"y\":%d,\"left\":%d,\"right\":%d,\"active\":%d}",
                            id(joy_x), id(joy_y), id(joy_left), id(joy_right),
                            id(joy_active) ? 1 : 0
                          );

                  - lambda: |-
                      if (!id(joy_active))
                        id(joy_send_stop) = false;

  # ----------------------------------------------------------
  # STATO + ANIMAZIONE ROBOT
  # ----------------------------------------------------------
  - interval: 50ms
    then:
      - lambda: |-
          auto lower = [](std::string s) {
            std::transform(s.begin(), s.end(), s.begin(),
                           [](unsigned char c){ return std::tolower(c); });
            return s;
          };

          std::string run = lower(id(mower_running).state);

          bool mowing =
            run.find("falciatura") != std::string::npos ||
            run.find("mowing") != std::string::npos;

          id(robot_mowing_active) = mowing;

          if (mowing) {
            id(robot_status_phase) += 0.05f / 4.8f;
            if (id(robot_status_phase) >= 1.0f)
              id(robot_status_phase) -= 1.0f;
          } else {
            id(robot_status_phase) = 0.0f;
          }

      - lvgl.widget.update:
          id: robot_status_runner
          x: !lambda |-
            if (!id(robot_mowing_active))
              return 270;
            return int(270 + 625.0f * id(robot_status_phase));

      - lvgl.widget.update:
          id: robot_grass_progress
          width: 0
          hidden: true

  - interval: 500ms
    then:
      - lvgl.label.update:
          id: lbl_robot_status
          text: !lambda |-
            auto lower = [](std::string s) {
              std::transform(s.begin(), s.end(), s.begin(),
                             [](unsigned char c){ return std::tolower(c); });
              return s;
            };

            std::string err=lower(id(mower_error).state);
            std::string run=lower(id(mower_running).state);
            std::string trk=lower(id(mower_tracking).state);
            std::string park=lower(id(mower_parked).state);
            std::string dock=lower(id(mower_docked).state);
            std::string charge=lower(id(mower_charge).state);
            float loop=id(mower_loop).state;

            if (err.find("error") != std::string::npos) return std::string("ERROR");
            if (run.find("falciatura") != std::string::npos || run.find("mowing") != std::string::npos)
              return std::string("Falciatura");
            if (!isnan(loop) && (int(loop)==111 || int(loop)==222)) return std::string("Tracking");
            if (charge.find("in carica") != std::string::npos || charge.find("charging") != std::string::npos)
              return std::string("In carica");
            if (dock.find("in base") != std::string::npos || dock.find("docked") != std::string::npos)
              return std::string("In base");
            if (park.find("parcheggiato") != std::string::npos || park.find("parked") != std::string::npos)
              return std::string("Parcheggiato");
            if (trk.find("tracciatura filo") != std::string::npos || trk.find("tracking") != std::string::npos)
              return std::string("Tracking");
            return std::string("Idle");

      - lvgl.label.update:
          id: lbl_robot_substatus
          text: !lambda |-
            auto lower = [](std::string s) {
              std::transform(s.begin(), s.end(), s.begin(),
                             [](unsigned char c){ return std::tolower(c); });
              return s;
            };

            std::string err=lower(id(mower_error).state);
            std::string run=lower(id(mower_running).state);
            std::string trk=lower(id(mower_tracking).state);
            std::string park=lower(id(mower_parked).state);
            std::string dock=lower(id(mower_docked).state);
            std::string charge=lower(id(mower_charge).state);
            float loop=id(mower_loop).state;

            if (err.find("error") != std::string::npos) return std::string("Robot sollevato");
            if (run.find("falciatura") != std::string::npos || run.find("mowing") != std::string::npos)
              return std::string("Robot in lavoro");
            if (!isnan(loop) && (int(loop)==111 || int(loop)==222)) return std::string("Ricerca filo");
            if (charge.find("in carica") != std::string::npos || charge.find("charging") != std::string::npos)
              return std::string("Robot in base");
            if (dock.find("in base") != std::string::npos || dock.find("docked") != std::string::npos)
              return std::string("In attesa di ricarica");
            if (park.find("parcheggiato") != std::string::npos || park.find("parked") != std::string::npos)
              return std::string("Robot fermo");
            if (trk.find("tracciatura filo") != std::string::npos || trk.find("tracking") != std::string::npos)
              return std::string("Tracciatura filo");
            return std::string("In attesa");

      - lvgl.widget.update:
          id: robot_status_panel
          bg_color: !lambda |-
            auto lower = [](std::string s) {
              std::transform(s.begin(), s.end(), s.begin(),
                             [](unsigned char c){ return std::tolower(c); });
              return s;
            };
            std::string err=lower(id(mower_error).state);
            std::string run=lower(id(mower_running).state);
            if (err.find("error") != std::string::npos) return lv_color_hex(0xD51D3C);
            if (run.find("falciatura") != std::string::npos || run.find("mowing") != std::string::npos)
              return lv_color_hex(0xFF9800);
            return lv_color_hex(0x59606D);