                        text: !lambda |-
                          auto now=id(ha_time).now();
                          if(!now.is_valid()) return std::string("--");
                          int cur=(now.day_of_week+5)%7;
                          time_t ts=now.timestamp+(0-cur)*86400;
                          struct tm tmv;
                          localtime_r(&ts,&tmv);
                          return str_sprintf("L  %02d/%02d/%04d",tmv.tm_mday,tmv.tm_mon+1,tmv.tm_year+1900);
