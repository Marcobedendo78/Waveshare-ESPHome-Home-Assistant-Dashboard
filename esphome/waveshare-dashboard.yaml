  - id: refresh_timer_ui
    then:
      - lvgl.label.update:
          id: lbl_timer_number
          text: !lambda |-
            return str_sprintf("Timer %d", id(timer_selected));

      - lvgl.label.update:
          id: lbl_timer_hour
          text: !lambda |-
            int n=id(timer_selected), v=8;
            if(n==1)v=id(t1_h); else if(n==2)v=id(t2_h); else if(n==3)v=id(t3_h);
            else if(n==4)v=id(t4_h); else if(n==5)v=id(t5_h); else v=id(t6_h);
            return str_sprintf("%02d", v);

      - lvgl.label.update:
          id: lbl_timer_minute
          text: !lambda |-
            int n=id(timer_selected), v=0;
            if(n==1)v=id(t1_m); else if(n==2)v=id(t2_m); else if(n==3)v=id(t3_m);
            else if(n==4)v=id(t4_m); else if(n==5)v=id(t5_m); else v=id(t6_m);
            return str_sprintf("%02d", v);

      - lvgl.label.update:
          id: lbl_timer_enabled
          text: !lambda |-
            int n=id(timer_selected), v=0;
            if(n==1)v=id(t1_e); else if(n==2)v=id(t2_e); else if(n==3)v=id(t3_e);
            else if(n==4)v=id(t4_e); else if(n==5)v=id(t5_e); else v=id(t6_e);
            return v ? std::string("ATTIVO") : std::string("OFF");

      - lvgl.label.update:
          id: lbl_timer_action
          text: !lambda |-
            int n=id(timer_selected), a=1;
            if(n==1)a=id(t1_a); else if(n==2)a=id(t2_a); else if(n==3)a=id(t3_a);
            else if(n==4)a=id(t4_a); else if(n==5)a=id(t5_a); else a=id(t6_a);
            const char* names[]={"","Uscita Z1","Uscita Z2","Taglia sul filo","Partenza rapida","Custom"};
            return std::string(names[a]);

  - id: save_all_timers
    then:
      - homeassistant.action:
          action: mqtt.publish
          data:
            topic: "home/robot/mower/control/timers"
            qos: "0"
            retain: "false"
          data_template:
            payload: "{{ timer_payload }}"
          variables:
            timer_payload: |-
              char b[900];
              snprintf(
                b, sizeof(b),
                "{\"type\":\"set_timers\",\"source\":\"waveshare_display\",\"save\":1,\"timers\":["
                "{\"id\":1,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d},"
                "{\"id\":2,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d},"
                "{\"id\":3,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d},"
                "{\"id\":4,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d},"
                "{\"id\":5,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d},"
                "{\"id\":6,\"hour\":%d,\"minute\":%d,\"enabled\":%d,\"action\":%d}]}",
                id(t1_h),id(t1_m),id(t1_e),id(t1_a),
                id(t2_h),id(t2_m),id(t2_e),id(t2_a),
                id(t3_h),id(t3_m),id(t3_e),id(t3_a),
                id(t4_h),id(t4_m),id(t4_e),id(t4_a),
                id(t5_h),id(t5_m),id(t5_e),id(t5_a),
                id(t6_h),id(t6_m),id(t6_e),id(t6_a)
              );
              return std::string(b);

# ============================================================
# STILI LVGL
# ============================================================

lvgl:
  displays:
    - main_display

  touchscreens:
    - touchscreen_id

  # ----------------------------------------------------------
  # SPEGNIMENTO LCD PER INATTIVITA'
  # ESP32, Wi-Fi, API e sensori restano sempre attivi.
  #
  # Dopo 5 minuti senza tocchi:
  #   - LVGL viene messo in pausa
  #   - viene spento solo LCD_DISP
  #
  # Il primo rilascio del touch riattiva LVGL e il pannello.
  # Essendo LVGL in pausa durante la pressione, quel primo tocco
  # non esegue il comando del pulsante sottostante.
  # ----------------------------------------------------------
  resume_on_input: true

  on_idle:
    - timeout: 5min
      then:
        - logger.log: "Display inattivo da 5 minuti: LCD OFF"
        - lvgl.pause:

  on_pause:
    then:
      - switch.turn_off: lcd_disp

  on_resume:
    then:
      - switch.turn_on: lcd_disp
      - delay: 80ms
      - lvgl.widget.redraw:
      - logger.log: "Touch rilevato: LCD ON"

  style_definitions:
    - id: nav_btn_style
      radius: 18
      bg_color: 0x25292D
      border_width: 1
      border_color: 0x43484F
      text_color: 0xF2F2F2
