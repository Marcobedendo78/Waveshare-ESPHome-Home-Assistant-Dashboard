# ============================================================
# SENSORI HOME ASSISTANT - ENERGIA
# ============================================================


binary_sensor:


  # ==========================================================
  # RISCALDAMENTO / TADO - STATI BINARI
  # Early Start escluso come richiesto.
  # ==========================================================

  - platform: homeassistant
    id: heat_salotto_power
    entity_id: binary_sensor.salotto_potenza
    internal: true
    trigger_on_initial_state: true

  - platform: homeassistant
    id: heat_salotto_link
    entity_id: binary_sensor.salotto_connettivita
    internal: true
    trigger_on_initial_state: true

  - platform: homeassistant
    id: heat_salotto_window
    entity_id: binary_sensor.salotto_finestra
    internal: true
    trigger_on_initial_state: true

  - platform: homeassistant
    id: heat_salotto_overlay
    entity_id: binary_sensor.salotto_sovrapponi
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.arc.update:
                  id: heat_salotto_arc
                  indicator:
                    arc_color: 0x9A4314
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0xD85A18
                    border_width: 3
              - if:
                  condition:
                    lambda: 'return id(heating_selected_room) == 0;'
                  then:
                    - lvgl.arc.update:
                        id: heating_popup_arc
                        indicator:
                          arc_color: 0x9A4314
                        knob:
                          bg_color: 0xFFFFFF
                          border_color: 0xD85A18
                          border_width: 3
            else:
              - lvgl.arc.update:
                  id: heat_salotto_arc
                  indicator:
                    arc_color: 0x2E6B36
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x43B853
                    border_width: 3
              - if:
                  condition:
                    lambda: 'return id(heating_selected_room) == 0;'
                  then:
                    - lvgl.arc.update:
