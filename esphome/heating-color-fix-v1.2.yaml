# ============================================================
# WAVESHARE DASHBOARD - HEATING SLIDER COLOR FIX
# v1.2.0 development patch
#
# Single source of truth for slider color:
#   overlay OFF -> green  (automatic schedule)
#   overlay ON  -> orange (manual temperature override)
#
# The original arc widgets already receive the correct overlay state.
# This patch reads the same binary sensors directly and reapplies the
# corresponding slider colors at a short interval, avoiding conflicts
# between package-level on_state/on_value handlers.
# ============================================================

interval:
  - interval: 500ms
    then:
      # Living room
      - if:
          condition: {lambda: 'return id(heat_salotto_overlay).state;'}
          then:
            - lvgl.slider.update:
                id: heat_salotto_slider
                indicator: {bg_color: 0x9A4314}
                knob: {bg_color: 0xFFFFFF, border_color: 0xD85A18}
          else:
            - lvgl.slider.update:
                id: heat_salotto_slider
                indicator: {bg_color: 0x2E6B36}
                knob: {bg_color: 0xFFFFFF, border_color: 0x43B853}

      # Study
      - if:
          condition: {lambda: 'return id(heat_studio_overlay).state;'}
          then:
            - lvgl.slider.update:
                id: heat_studio_slider
                indicator: {bg_color: 0x9A4314}
                knob: {bg_color: 0xFFFFFF, border_color: 0xD85A18}
          else:
            - lvgl.slider.update:
                id: heat_studio_slider
                indicator: {bg_color: 0x2E6B36}
                knob: {bg_color: 0xFFFFFF, border_color: 0x43B853}

      # Main bedroom
      - if:
          condition: {lambda: 'return id(heat_camera_matrimoniale_overlay).state;'}
          then:
            - lvgl.slider.update:
                id: heat_camera_matrimoniale_slider
                indicator: {bg_color: 0x9A4314}
                knob: {bg_color: 0xFFFFFF, border_color: 0xD85A18}
          else:
            - lvgl.slider.update:
                id: heat_camera_matrimoniale_slider
                indicator: {bg_color: 0x2E6B36}
                knob: {bg_color: 0xFFFFFF, border_color: 0x43B853}

      # Bedroom
      - if:
          condition: {lambda: 'return id(heat_camera_da_letto_overlay).state;'}
          then:
            - lvgl.slider.update:
                id: heat_camera_da_letto_slider
                indicator: {bg_color: 0x9A4314}
                knob: {bg_color: 0xFFFFFF, border_color: 0xD85A18}
          else:
            - lvgl.slider.update:
                id: heat_camera_da_letto_slider
                indicator: {bg_color: 0x2E6B36}
                knob: {bg_color: 0xFFFFFF, border_color: 0x43B853}

      # Popup follows the currently selected room.
      - if:
          condition:
            lambda: |-
              switch (id(heating_selected_room)) {
                case 0: return id(heat_salotto_overlay).state;
                case 1: return id(heat_studio_overlay).state;
                case 2: return id(heat_camera_matrimoniale_overlay).state;
                default: return id(heat_camera_da_letto_overlay).state;
              }
          then:
            - lvgl.slider.update:
                id: heating_popup_slider
                indicator: {bg_color: 0x9A4314}
                knob: {bg_color: 0xFFFFFF, border_color: 0xD85A18}
          else:
            - lvgl.slider.update:
                id: heating_popup_slider
                indicator: {bg_color: 0x2E6B36}
                knob: {bg_color: 0xFFFFFF, border_color: 0x43B853}
