# ============================================================
# WAVESHARE ESP32-S3 TOUCH LCD 7B
# Example ESPHome secrets file
#
# Copy the required values into your ESPHome secrets.yaml file.
# Never publish your real passwords or encryption keys on GitHub.
# ============================================================

# Wi-Fi
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# ESPHome native API encryption key
# Generate one from ESPHome or use the key created for your device.
waveshare_display_encryption_key: "YOUR_ESPHOME_API_ENCRYPTION_KEY"

# Fallback access point password
# Use at least 8 characters.
waveshare_display_ap_password: "YOUR_FALLBACK_AP_PASSWORD"
