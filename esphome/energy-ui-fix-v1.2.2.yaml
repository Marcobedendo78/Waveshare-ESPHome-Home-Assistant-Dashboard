# ============================================================
# WAVESHARE DASHBOARD - ENERGY UI FIX
# v1.2.2 development
#
# Visual refinement for the 1024x512 Energy page:
# - raises the complete flow diagram so lower values remain inside the card
# - recolors the four flow icons to match their circles
# - moves device rows upward and keeps the total row fully visible
# - adds a colored icon to every summary/device/battery row
# ============================================================

image:
  - platform: file
    file: "mdi:solar-panel"
    id: img_energy_solar_small
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:transmission-tower"
    id: img_energy_grid_small
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:transmission-tower-export"
    id: img_energy_export_small
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:battery-plus"
    id: img_energy_battery_plus
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:battery-minus"
    id: img_energy_battery_minus
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:home"
    id: img_energy_home_small
    type: BINARY
    resize: 22x22

  - platform: file
    file: "mdi:ev-station"
    id: img_energy_wallbox_small
    type: BINARY
    resize: 21x21

  - platform: file
    file: "mdi:heat-pump-outline"
    id: img_energy_pdc_small
    type: BINARY
    resize: 21x21

  - platform: file
    file: "mdi:lightbulb"
    id: img_energy_gate_light_small
    type: BINARY
    resize: 21x21

  - platform: file
    file: "mdi:lightbulb-on-outline"
    id: img_energy_path_light_small
    type: BINARY
    resize: 21x21

  - platform: file
