            y: 8
            width: 620
            height: 322
            bg_color: 0x151C24
            bg_opa: COVER
            border_color: 0x303A45
            border_width: 1
            radius: 16
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label: {x: 18, y: 12, text: "Energia", text_font: roboto_bold_22, text_color: 0xFFFFFF}
              - label: {id: energy_fix_date, x: 430, y: 14, width: 165, text_align: RIGHT, text: "--/--/----", text_font: roboto_16, text_color: 0xDCE2E8}

              # Flow lines
              - obj: {x: 115, y: 190, width: 145, height: 3, bg_color: 0x3FA7FF, border_width: 0, radius: 0}
