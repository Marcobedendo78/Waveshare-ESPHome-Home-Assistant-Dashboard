# ============================================================
# WAVESHARE DASHBOARD - ENERGY LAYOUT FIX
# v1.2.3
#
# Refines the Energy page without changing its data logic:
# - flow area shifted left and made shorter
# - solar details moved to the right of the solar circle
# - solar-to-home connection restored
# - device area enlarged
# - single-line device names
# - smaller gate/path icons
# ============================================================

image:
  - platform: file
    file: "mdi:gate"
    id: img_energy_gate_small
    type: BINARY
    resize: 28x28
  - platform: file
    file: "mdi:light-switch"
    id: img_energy_path_small
    type: BINARY
    resize: 28x28

script:
  - id: energy_layout_fix_refresh
    mode: restart
    then:
      - lvgl.label.update:
          id: energy_fix_solar
          text: !lambda |-
            float v=id(energy_page_solar_daily_sensor).state;
            return isnan(v)?std::string("-- kWh"):str_sprintf("%.2f kWh",v);
      - lvgl.label.update: {id: energy_fix_grid_import, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_grid_import));'}
      - lvgl.label.update: {id: energy_fix_grid_export, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_grid_export));'}
      - lvgl.label.update: {id: energy_fix_home, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_home));'}
      - lvgl.label.update:
          id: energy_fix_battery_charge
          text: !lambda |-
            float v=id(energy_page_battery_charge_sensor).state;
            return isnan(v)?std::string("-- kWh"):str_sprintf("%.2f kWh",v);
      - lvgl.label.update:
          id: energy_fix_battery_discharge
          text: !lambda |-
            float v=id(energy_page_battery_discharge_sensor).state;
            return isnan(v)?std::string("-- kWh"):str_sprintf("%.2f kWh",v);
      - lvgl.label.update: {id: energy_fix_dev_wallbox_value, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_wallbox));'}
      - lvgl.label.update: {id: energy_fix_dev_pdc_value, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_pdc));'}
      - lvgl.label.update: {id: energy_fix_dev_gate_value, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_gate_lights));'}
      - lvgl.label.update: {id: energy_fix_dev_path_value, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_path_lights));'}
      - lvgl.label.update: {id: energy_fix_dev_total_value, text: !lambda 'return str_sprintf("%.2f kWh",id(energy_page_today_devices));'}
      - lvgl.label.update: {id: energy_fix_dev_wallbox_pct, text: !lambda 'float h=id(energy_page_today_home); return str_sprintf("%.1f %%",h>0.01f?id(energy_page_today_wallbox)/h*100.0f:0.0f);'}
      - lvgl.label.update: {id: energy_fix_dev_pdc_pct, text: !lambda 'float h=id(energy_page_today_home); return str_sprintf("%.1f %%",h>0.01f?id(energy_page_today_pdc)/h*100.0f:0.0f);'}
      - lvgl.label.update: {id: energy_fix_dev_gate_pct, text: !lambda 'float h=id(energy_page_today_home); return str_sprintf("%.1f %%",h>0.01f?id(energy_page_today_gate_lights)/h*100.0f:0.0f);'}
      - lvgl.label.update: {id: energy_fix_dev_path_pct, text: !lambda 'float h=id(energy_page_today_home); return str_sprintf("%.1f %%",h>0.01f?id(energy_page_today_path_lights)/h*100.0f:0.0f);'}
      - lvgl.label.update: {id: energy_fix_dev_total_pct, text: !lambda 'float h=id(energy_page_today_home); return str_sprintf("%.1f %%",h>0.01f?id(energy_page_today_devices)/h*100.0f:0.0f);'}
      - lvgl.bar.update: {id: energy_fix_bar_wallbox, value: !lambda 'float h=id(energy_page_today_home); return h>0.01f?int(fminf(100.0f,id(energy_page_today_wallbox)/h*100.0f)):0;'}
      - lvgl.bar.update: {id: energy_fix_bar_pdc, value: !lambda 'float h=id(energy_page_today_home); return h>0.01f?int(fminf(100.0f,id(energy_page_today_pdc)/h*100.0f)):0;'}
      - lvgl.bar.update: {id: energy_fix_bar_gate, value: !lambda 'float h=id(energy_page_today_home); return h>0.01f?int(fminf(100.0f,id(energy_page_today_gate_lights)/h*100.0f)):0;'}
      - lvgl.bar.update: {id: energy_fix_bar_path, value: !lambda 'float h=id(energy_page_today_home); return h>0.01f?int(fminf(100.0f,id(energy_page_today_path_lights)/h*100.0f)):0;'}

interval:
  - interval: 10s
    then:
      - script.execute: energy_layout_fix_refresh

lvgl:
  pages:
    - id: !extend page_energy
      widgets:
        # Replacement upper-left card: 280 px high instead of 322 px.
        - obj:
            x: 10
            y: 8
            width: 620
            height: 280
            bg_color: 0x151C24
            bg_opa: COVER
            border_color: 0x303A45
            border_width: 1
            radius: 16
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label: {x: 18, y: 12, text: "Energia", text_font: roboto_bold_22, text_color: 0xFFFFFF}
              - label: {x: 430, y: 14, width: 165, text_align: RIGHT, text: "29/08/2026", text_font: roboto_16, text_color: 0xDCE2E8}

              # Flow lines. Nodes are shifted left and the solar vertical line reaches Casa.
              - obj: {x: 98, y: 160, width: 145, height: 3, bg_color: 0x3FA7FF, border_width: 0, radius: 0}
              - obj: {x: 279, y: 91, width: 3, height: 32, bg_color: 0xFFC400, border_width: 0, radius: 0}
              - obj: {x: 319, y: 160, width: 154, height: 3, bg_color: 0x75D34B, border_width: 0, radius: 0}

              # Solar: data moved to the right, leaving the line below clear.
              - obj:
                  x: 244
                  y: 18
                  width: 74
                  height: 74
                  radius: 37
                  bg_color: 0x111820
                  border_width: 2
                  border_color: 0xFFC400
                  scrollable: false
                  widgets:
                    - image: {src: img_solar, align: CENTER, image_recolor: 0xFFC400, image_recolor_opa: COVER}
              - label: {x: 328, y: 24, width: 105, text: "Solare", text_font: roboto_bold_16, text_color: 0xFFFFFF}
              - label: {x: 328, y: 47, width: 105, text: "Produzione", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {id: energy_fix_solar, x: 328, y: 65, width: 130, text: "-- kWh", text_font: roboto_bold_18, text_color: 0xFFC400}

              # Grid
              - obj:
                  x: 23
                  y: 122
                  width: 76
                  height: 76
                  radius: 38
                  bg_color: 0x111820
                  border_width: 2
                  border_color: 0x3FA7FF
                  scrollable: false
                  widgets:
                    - image: {src: img_grid, align: CENTER, image_recolor: 0x3FA7FF, image_recolor_opa: COVER}
              - label: {x: 6, y: 200, width: 110, text_align: CENTER, text: "Rete", text_font: roboto_bold_16, text_color: 0xFFFFFF}
              - label: {x: 0, y: 220, width: 60, text_align: CENTER, text: "Consumo", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {x: 61, y: 220, width: 70, text_align: CENTER, text: "Esportata", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {id: energy_fix_grid_import, x: 0, y: 239, width: 65, text_align: CENTER, text: "-- kWh", text_font: roboto_bold_14, text_color: 0x3FA7FF}
              - label: {id: energy_fix_grid_export, x: 61, y: 239, width: 76, text_align: CENTER, text: "-- kWh", text_font: roboto_bold_14, text_color: 0x7FC5FF}

              # Home
              - obj:
                  x: 243
                  y: 122
                  width: 76
                  height: 76
                  radius: 38
                  bg_color: 0x111820
                  border_width: 2
                  border_color: 0xF2F2F2
                  scrollable: false
                  widgets:
                    - image: {src: img_home, align: CENTER, image_recolor: 0xF2F2F2, image_recolor_opa: COVER}
              - label: {x: 226, y: 200, width: 110, text_align: CENTER, text: "Casa", text_font: roboto_bold_16, text_color: 0xFFFFFF}
              - label: {x: 211, y: 220, width: 140, text_align: CENTER, text: "Consumo totale", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {id: energy_fix_home, x: 201, y: 239, width: 160, text_align: CENTER, text: "-- kWh", text_font: roboto_bold_18, text_color: 0xFFFFFF}

              # Battery moved left to keep both values away from the right border.
              - obj:
                  x: 473
                  y: 122
                  width: 76
                  height: 76
                  radius: 38
                  bg_color: 0x111820
                  border_width: 2
                  border_color: 0x75D34B
                  scrollable: false
                  widgets:
                    - image: {src: img_battery, align: CENTER, image_recolor: 0x75D34B, image_recolor_opa: COVER}
              - label: {x: 455, y: 200, width: 112, text_align: CENTER, text: "Batteria", text_font: roboto_bold_16, text_color: 0xFFFFFF}
              - label: {x: 428, y: 220, width: 82, text_align: CENTER, text: "Caricata", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {x: 511, y: 220, width: 82, text_align: CENTER, text: "Scaricata", text_font: roboto_12, text_color: 0xAEB4BF}
              - label: {id: energy_fix_battery_charge, x: 416, y: 239, width: 100, text_align: CENTER, text: "-- kWh", text_font: roboto_bold_14, text_color: 0x75D34B}
              - label: {id: energy_fix_battery_discharge, x: 507, y: 239, width: 100, text_align: CENTER, text: "-- kWh", text_font: roboto_bold_14, text_color: 0xA6E789}

        # Larger device card uses the 42 px recovered above.
        - obj:
            x: 10
            y: 298
            width: 620
            height: 206
            bg_color: 0x151C24
            bg_opa: COVER
            border_color: 0x303A45
            border_width: 1
            radius: 16
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label: {x: 18, y: 8, text: "Consumi dispositivi", text_font: roboto_bold_18, text_color: 0xFFFFFF}

              - image: {x: 17, y: 34, src: img_auto, image_recolor: 0xD68AFF, image_recolor_opa: COVER}
              - label: {x: 54, y: 38, width: 128, text: "Wallbox", text_font: roboto_14, text_color: 0xE8EDF2}
              - bar: {id: energy_fix_bar_wallbox, x: 185, y: 46, width: 210, height: 7, min_value: 0, max_value: 100, value: 0, bg_color: 0x28313B, radius: 4, indicator: {bg_color: 0xB667E8, radius: 4}}
              - label: {id: energy_fix_dev_wallbox_value, x: 405, y: 36, width: 112, text_align: RIGHT, text: "-- kWh", text_font: roboto_bold_14, text_color: 0xD68AFF}
              - label: {id: energy_fix_dev_wallbox_pct, x: 525, y: 36, width: 72, text_align: RIGHT, text: "-- %", text_font: roboto_14, text_color: 0xAEB4BF}

              - image: {x: 15, y: 66, src: img_pdc, image_recolor: 0x6DCCFF, image_recolor_opa: COVER}
              - label: {x: 54, y: 70, width: 128, text: "Pompa di calore", text_font: roboto_14, text_color: 0xE8EDF2}
              - bar: {id: energy_fix_bar_pdc, x: 185, y: 78, width: 210, height: 7, min_value: 0, max_value: 100, value: 0, bg_color: 0x28313B, radius: 4, indicator: {bg_color: 0x37B9FF, radius: 4}}
              - label: {id: energy_fix_dev_pdc_value, x: 405, y: 68, width: 112, text_align: RIGHT, text: "-- kWh", text_font: roboto_bold_14, text_color: 0x6DCCFF}
              - label: {id: energy_fix_dev_pdc_pct, x: 525, y: 68, width: 72, text_align: RIGHT, text: "-- %", text_font: roboto_14, text_color: 0xAEB4BF}

              - image: {x: 20, y: 99, src: img_energy_gate_small, image_recolor: 0xFFD54F, image_recolor_opa: COVER}
              - label: {x: 54, y: 102, width: 128, text: "Luci cancello", text_font: roboto_14, text_color: 0xE8EDF2}
              - bar: {id: energy_fix_bar_gate, x: 185, y: 110, width: 210, height: 7, min_value: 0, max_value: 100, value: 0, bg_color: 0x28313B, radius: 4, indicator: {bg_color: 0xFFC400, radius: 4}}
              - label: {id: energy_fix_dev_gate_value, x: 405, y: 100, width: 112, text_align: RIGHT, text: "-- kWh", text_font: roboto_bold_14, text_color: 0xFFD54F}
              - label: {id: energy_fix_dev_gate_pct, x: 525, y: 100, width: 72, text_align: RIGHT, text: "-- %", text_font: roboto_14, text_color: 0xAEB4BF}

              - image: {x: 20, y: 131, src: img_energy_path_small, image_recolor: 0xFFBE4A, image_recolor_opa: COVER}
              - label: {x: 54, y: 134, width: 128, text: "Luci vialetto", text_font: roboto_14, text_color: 0xE8EDF2}
              - bar: {id: energy_fix_bar_path, x: 185, y: 142, width: 210, height: 7, min_value: 0, max_value: 100, value: 0, bg_color: 0x28313B, radius: 4, indicator: {bg_color: 0xF2A51A, radius: 4}}
              - label: {id: energy_fix_dev_path_value, x: 405, y: 132, width: 112, text_align: RIGHT, text: "-- kWh", text_font: roboto_bold_14, text_color: 0xFFBE4A}
              - label: {id: energy_fix_dev_path_pct, x: 525, y: 132, width: 72, text_align: RIGHT, text: "-- %", text_font: roboto_14, text_color: 0xAEB4BF}

              - obj: {x: 18, y: 164, width: 580, height: 1, bg_color: 0x303A45, border_width: 0}
              - image: {x: 17, y: 168, src: img_home, image_recolor: 0xFFFFFF, image_recolor_opa: COVER}
              - label: {x: 54, y: 174, text: "Totale monitorato", text_font: roboto_bold_14, text_color: 0xFFFFFF}
              - label: {id: energy_fix_dev_total_value, x: 392, y: 171, width: 125, text_align: RIGHT, text: "-- kWh", text_font: roboto_bold_16, text_color: 0xFFFFFF}
              - label: {id: energy_fix_dev_total_pct, x: 525, y: 172, width: 72, text_align: RIGHT, text: "-- %", text_font: roboto_14, text_color: 0xAEB4BF}
