# ============================================================
# WAVESHARE DASHBOARD - ENERGY PAGE
# v1.2.1 development
# Native 1024x512 layout: bottom navigation remains in base package.
# Daily baselines are stored both in ESP32 NVS and on the microSD.
# ============================================================

substitutions:
  energy_page_solar_daily: "sensor.inverter_rendimento_giornaliero"
  energy_page_grid_import_total: "sensor.power_meter_consumo"
  energy_page_grid_export_total: "sensor.power_meter_esportata"
  energy_page_battery_charge_daily: "sensor.battery_carica_giornaliera"
  energy_page_battery_discharge_daily: "sensor.battery_scarica_giornaliera"
  energy_page_wallbox_total: "sensor.wallbox_energy_active_import_register_2"
  energy_page_pdc_total: "sensor.consumo_totale_pdc_2"
  energy_page_gate_lights_total: "sensor.shelly_pro2_energy_2"
  energy_page_path_lights_total: "sensor.shelly_pro2_energy"

globals:
  - id: energy_page_baseline_schema
    type: int
    restore_value: yes
    initial_value: '0'
  - id: energy_page_day_key
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: energy_page_base_grid_import
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: energy_page_base_grid_export
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: energy_page_base_wallbox
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: energy_page_base_pdc
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: energy_page_base_gate_lights
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: energy_page_base_path_lights
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: energy_page_today_grid_import
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_grid_export
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_home
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_wallbox
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_pdc
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_gate_lights
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_path_lights
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_today_devices
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: energy_page_battery_balance
    type: float
    restore_value: no
    initial_value: '0.0'

sensor:
  - platform: homeassistant
    id: energy_page_solar_daily_sensor
    entity_id: ${energy_page_solar_daily}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_grid_import_counter
    entity_id: ${energy_page_grid_import_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_grid_export_counter
    entity_id: ${energy_page_grid_export_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_battery_charge_sensor
    entity_id: ${energy_page_battery_charge_daily}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_battery_discharge_sensor
    entity_id: ${energy_page_battery_discharge_daily}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_wallbox_counter
    entity_id: ${energy_page_wallbox_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_pdc_counter
    entity_id: ${energy_page_pdc_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_gate_lights_counter
    entity_id: ${energy_page_gate_lights_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

  - platform: homeassistant
    id: energy_page_path_lights_counter
    entity_id: ${energy_page_path_lights_total}
    internal: true
    on_value:
      - script.execute: energy_page_refresh

script:
  - id: energy_page_refresh
    mode: restart
    then:
      - lambda: |-
          const float gi = id(energy_page_grid_import_counter).state;
          const float ge = id(energy_page_grid_export_counter).state;
          const float wb = id(energy_page_wallbox_counter).state;
          const float hp = id(energy_page_pdc_counter).state;
          const float gl = id(energy_page_gate_lights_counter).state;
          const float pl = id(energy_page_path_lights_counter).state;

          auto now = id(ha_time).now();
          const bool counters_ok = !isnan(gi) && !isnan(ge) && !isnan(wb) &&
                                   !isnan(hp) && !isnan(gl) && !isnan(pl);

          if (now.is_valid() && counters_ok) {
            const int day_key = now.year * 10000 + now.month * 100 + now.day_of_month;

            // Schema 3 adds a second copy of the daily baselines on microSD.
            // If the ESP32 preferences are lost after an update, a same-day
            // microSD baseline is restored instead of falling back to lifetime
            // cumulative values.
            if (id(energy_page_baseline_schema) != 3 || id(energy_page_day_key) != day_key) {
              float sd_gi = 0.0f;
              float sd_ge = 0.0f;
              float sd_wb = 0.0f;
              float sd_hp = 0.0f;
              float sd_gl = 0.0f;
              float sd_pl = 0.0f;

              const bool restored_from_sd = id(dashboard_sd).load_energy_baseline(
                  day_key, &sd_gi, &sd_ge, &sd_wb, &sd_hp, &sd_gl, &sd_pl);

              if (restored_from_sd) {
                id(energy_page_base_grid_import) = sd_gi;
                id(energy_page_base_grid_export) = sd_ge;
                id(energy_page_base_wallbox) = sd_wb;
                id(energy_page_base_pdc) = sd_hp;
                id(energy_page_base_gate_lights) = sd_gl;
                id(energy_page_base_path_lights) = sd_pl;
              } else {
                id(energy_page_base_grid_import) = gi;
                id(energy_page_base_grid_export) = ge;
                id(energy_page_base_wallbox) = wb;
                id(energy_page_base_pdc) = hp;
                id(energy_page_base_gate_lights) = gl;
                id(energy_page_base_path_lights) = pl;

                id(dashboard_sd).save_energy_baseline(
                    day_key, gi, ge, wb, hp, gl, pl);
              }

              id(energy_page_day_key) = day_key;
              id(energy_page_baseline_schema) = 3;
            }
          }

          auto delta = [](float current, float baseline) -> float {
            if (isnan(current)) return 0.0f;
            const float d = current - baseline;
            return d > 0.0f ? d : 0.0f;
          };

          id(energy_page_today_grid_import) = delta(gi, id(energy_page_base_grid_import));
          id(energy_page_today_grid_export) = delta(ge, id(energy_page_base_grid_export));
          id(energy_page_today_wallbox) = delta(wb, id(energy_page_base_wallbox));
          id(energy_page_today_pdc) = delta(hp, id(energy_page_base_pdc));
          id(energy_page_today_gate_lights) = delta(gl, id(energy_page_base_gate_lights));
          id(energy_page_today_path_lights) = delta(pl, id(energy_page_base_path_lights));

          const float solar = isnan(id(energy_page_solar_daily_sensor).state)
                                  ? 0.0f : id(energy_page_solar_daily_sensor).state;
          const float bchg = isnan(id(energy_page_battery_charge_sensor).state)
                                 ? 0.0f : id(energy_page_battery_charge_sensor).state;
          const float bdis = isnan(id(energy_page_battery_discharge_sensor).state)
                                 ? 0.0f : id(energy_page_battery_discharge_sensor).state;

          float home = solar + id(energy_page_today_grid_import) + bdis
                       - id(energy_page_today_grid_export) - bchg;
          if (home < 0.0f) home = 0.0f;
          id(energy_page_today_home) = home;

          id(energy_page_today_devices) = id(energy_page_today_wallbox)
                                          + id(energy_page_today_pdc)
                                          + id(energy_page_today_gate_lights)
                                          + id(energy_page_today_path_lights);
          id(energy_page_battery_balance) = bchg - bdis;

      - lvgl.label.update:
          id: energy_lbl_date
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--/--/----");
            return str_sprintf("%02d/%02d/%04d", now.day_of_month, now.month, now.year);

      - lvgl.label.update:
          id: energy_lbl_solar
          text: !lambda |-
            float v = id(energy_page_solar_daily_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_lbl_grid_import
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_grid_import));'
      - lvgl.label.update:
          id: energy_lbl_grid_export
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_grid_export));'
      - lvgl.label.update:
          id: energy_lbl_home
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_home));'
      - lvgl.label.update:
          id: energy_lbl_battery_charge
          text: !lambda |-
            float v = id(energy_page_battery_charge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_lbl_battery_discharge
          text: !lambda |-
            float v = id(energy_page_battery_discharge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);

      - lvgl.label.update:
          id: energy_sum_solar
          text: !lambda |-
            float v = id(energy_page_solar_daily_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_sum_grid_import
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_grid_import));'
      - lvgl.label.update:
          id: energy_sum_grid_export
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_grid_export));'
      - lvgl.label.update:
          id: energy_sum_battery_charge
          text: !lambda |-
            float v = id(energy_page_battery_charge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_sum_battery_discharge
          text: !lambda |-
            float v = id(energy_page_battery_discharge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_sum_home
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_home));'

      - lvgl.label.update:
          id: energy_dev_wallbox_value
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_wallbox));'
      - lvgl.label.update:
          id: energy_dev_pdc_value
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_pdc));'
      - lvgl.label.update:
          id: energy_dev_gate_value
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_gate_lights));'
      - lvgl.label.update:
          id: energy_dev_path_value
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_path_lights));'
      - lvgl.label.update:
          id: energy_dev_total_value
          text: !lambda 'return str_sprintf("%.2f kWh", id(energy_page_today_devices));'

      - lvgl.label.update:
          id: energy_dev_wallbox_pct
          text: !lambda |-
            float h = id(energy_page_today_home);
            return str_sprintf("%.1f %%", h > 0.01f ? id(energy_page_today_wallbox) / h * 100.0f : 0.0f);
      - lvgl.label.update:
          id: energy_dev_pdc_pct
          text: !lambda |-
            float h = id(energy_page_today_home);
            return str_sprintf("%.1f %%", h > 0.01f ? id(energy_page_today_pdc) / h * 100.0f : 0.0f);
      - lvgl.label.update:
          id: energy_dev_gate_pct
          text: !lambda |-
            float h = id(energy_page_today_home);
            return str_sprintf("%.1f %%", h > 0.01f ? id(energy_page_today_gate_lights) / h * 100.0f : 0.0f);
      - lvgl.label.update:
          id: energy_dev_path_pct
          text: !lambda |-
            float h = id(energy_page_today_home);
            return str_sprintf("%.1f %%", h > 0.01f ? id(energy_page_today_path_lights) / h * 100.0f : 0.0f);
      - lvgl.label.update:
          id: energy_dev_total_pct
          text: !lambda |-
            float h = id(energy_page_today_home);
            return str_sprintf("%.1f %%", h > 0.01f ? id(energy_page_today_devices) / h * 100.0f : 0.0f);

      - lvgl.bar.update:
          id: energy_bar_wallbox
          value: !lambda |-
            float h = id(energy_page_today_home);
            return h > 0.01f ? int(fminf(100.0f, id(energy_page_today_wallbox) / h * 100.0f)) : 0;
      - lvgl.bar.update:
          id: energy_bar_pdc
          value: !lambda |-
            float h = id(energy_page_today_home);
            return h > 0.01f ? int(fminf(100.0f, id(energy_page_today_pdc) / h * 100.0f)) : 0;
      - lvgl.bar.update:
          id: energy_bar_gate
          value: !lambda |-
            float h = id(energy_page_today_home);
            return h > 0.01f ? int(fminf(100.0f, id(energy_page_today_gate_lights) / h * 100.0f)) : 0;
      - lvgl.bar.update:
          id: energy_bar_path
          value: !lambda |-
            float h = id(energy_page_today_home);
            return h > 0.01f ? int(fminf(100.0f, id(energy_page_today_path_lights) / h * 100.0f)) : 0;

      - lvgl.label.update:
          id: energy_bat_charge_value
          text: !lambda |-
            float v = id(energy_page_battery_charge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_bat_discharge_value
          text: !lambda |-
            float v = id(energy_page_battery_discharge_sensor).state;
            return isnan(v) ? std::string("-- kWh") : str_sprintf("%.2f kWh", v);
      - lvgl.label.update:
          id: energy_bat_balance_value
          text: !lambda 'return str_sprintf("%+.2f kWh", id(energy_page_battery_balance));'

interval:
  - interval: 10s
    then:
      - script.execute: energy_page_refresh

