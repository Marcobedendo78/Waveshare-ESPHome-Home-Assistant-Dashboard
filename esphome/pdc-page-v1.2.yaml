# ============================================================
# WAVESHARE DASHBOARD - PDC / HEAT PUMP PAGE
# v1.2.0 development
# ============================================================

image:
  - platform: file
    file: "${pdc_image_file}"
    id: pdc_background
    type: RGB565
    resize: 1024x512

globals:
  - id: pdc_flow_phase
    type: int
    restore_value: no
    initial_value: '0'

sensor:
  - platform: homeassistant
    id: pdc_supply_temp
    entity_id: ${pdc_supply_temperature}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_supply
          text: !lambda 'return isnan(x) ? std::string("--.- C") : str_sprintf("%.1f C", x);'
  - platform: homeassistant
    id: pdc_return_temp
    entity_id: ${pdc_return_temperature}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_return
          text: !lambda 'return isnan(x) ? std::string("--.- C") : str_sprintf("%.1f C", x);'
  - platform: homeassistant
    id: pdc_power_absorbed
    entity_id: ${pdc_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_power
          text: !lambda |-
            if (isnan(x)) return std::string("-- W");
            if (fabsf(x) < 1000.0f) return str_sprintf("%.0f W", x);
            return str_sprintf("%.2f kW", x / 1000.0f);
  - platform: homeassistant
    id: pdc_thermal_power
    entity_id: ${pdc_thermal_power}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_thermal_power
          text: !lambda 'return isnan(x) ? std::string("-- kWt") : str_sprintf("%.2f kWt", x);'
  - platform: homeassistant
    id: pdc_dhw_temp
    entity_id: ${pdc_dhw_temperature}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_dhw
          text: !lambda 'return isnan(x) ? std::string("--.- C") : str_sprintf("%.1f C", x);'
  - platform: homeassistant
    id: pdc_compressor_hz
    entity_id: ${pdc_compressor}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_compressor
          text: !lambda 'return isnan(x) ? std::string("-- Hz") : str_sprintf("%.0f Hz", x);'
  - platform: homeassistant
    id: pdc_water_flow
    entity_id: ${pdc_water_flow}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_flow
          text: !lambda 'return isnan(x) ? std::string("-- l/min") : str_sprintf("%.1f l/min", x);'
  - platform: homeassistant
    id: pdc_fan_rpm
    entity_id: ${pdc_fan_rpm}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_fan
          text: !lambda 'return isnan(x) ? std::string("-- rpm") : str_sprintf("%.0f rpm", x);'
  - platform: homeassistant
    id: pdc_pressure
    entity_id: ${pdc_pressure}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_pressure
          text: !lambda 'return isnan(x) ? std::string("-- bar") : str_sprintf("%.1f bar", x);'
  - platform: homeassistant
    id: pdc_indoor_temp
    entity_id: ${pdc_indoor_temperature}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_indoor
          text: !lambda 'return isnan(x) ? std::string("--.- C") : str_sprintf("%.1f C", x);'
  - platform: homeassistant
    id: pdc_outdoor_temp
    entity_id: ${pdc_outdoor_temperature}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_outdoor
          text: !lambda 'return isnan(x) ? std::string("--.- C") : str_sprintf("%.1f C", x);'
  - platform: homeassistant
    id: pdc_cop
    entity_id: ${pdc_cop}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_cop
          text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.2f", x);'

text_sensor:
  - platform: homeassistant
    id: pdc_thermostat
    entity_id: ${pdc_thermostat}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_thermostat
          text: !lambda |-
            std::string s = x;
            for (auto &c : s) c = tolower(c);
            if (s == "on") return std::string("ON");
            if (s == "off") return std::string("OFF");
            return x.empty() ? std::string("--") : x;
  - platform: homeassistant
    id: pdc_operating_mode
    entity_id: ${pdc_operating_mode}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_mode
          text: !lambda 'return x.empty() ? std::string("--") : x;'
  - platform: homeassistant
    id: pdc_indoor_outdoor_mode
    entity_id: ${pdc_indoor_outdoor_mode}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_io_mode
          text: !lambda 'return x.empty() ? std::string("--") : x;'
  - platform: homeassistant
    id: pdc_defrost
    entity_id: ${pdc_defrost}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_defrost
          text: !lambda |-
            std::string s = x;
            for (auto &c : s) c = tolower(c);
            return s == "on" ? std::string("ATTIVO") : std::string("NO");
  - platform: homeassistant
    id: pdc_freeze_protection
    entity_id: ${pdc_freeze_protection}
    internal: true
    on_value:
      - lvgl.label.update:
          id: pdc_lbl_freeze
          text: !lambda |-
            std::string s = x;
            for (auto &c : s) c = tolower(c);
            return s == "on" ? std::string("ATTIVA") : std::string("NO");

